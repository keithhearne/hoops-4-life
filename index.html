<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hoops 4 Life</title>
<meta name="theme-color" content="#10152B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{overscroll-behavior:none;touch-action:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;900&display=swap">
<style>
/* One-screen arcade court: canvas scaled to fit, controls drawn in-game. Single dark arena look. */
:root{
  --arena:#10152B; --court:#1B2340; --ink:#FFFFFF; --muted:#C9D1EE; --accent:#FFC93C;
  --display:"Bungee", "Arial Black", Impact, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--arena); color:var(--ink); font-family:var(--body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0; box-sizing:border-box; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;border-radius:10px;background:var(--court)}
canvas:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#rotate{
  position:fixed; inset:0; background:var(--arena); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:14px; text-align:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
}
#rotate[hidden]{display:none}
#rotate h1{font-family:var(--display);font-size:28px;margin:0;color:var(--accent);text-wrap:balance}
#rotate p{margin:0;color:var(--muted);font-weight:700;max-width:30ch}
#rotate button{
  font:900 16px var(--body); color:var(--court); background:var(--accent); border:0;
  border-radius:14px; padding:12px 22px; cursor:pointer;
}
#rotate button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>

<div id="wrap"><canvas id="game" tabindex="0" aria-label="Hoops 4 Life basketball game. Use the joystick to move, Jump to jump or block, and hold Shoot to power up a shot."></canvas></div>
<div id="rotate" hidden>
  <h1>Turn your phone sideways</h1>
  <p>Hoops 4 Life is played in landscape so both hoops fit on screen.</p>
  <button id="rotateOk" type="button">Play anyway</button>
</div>

function pick(cat){
  const list=COMMENTS[cat]; let i=Math.floor(Math.random()*list.length);

  lastPick[cat]=i; return list[i];

const cv=document.getElementById("game"), ctx=cv.getContext("2d");
let scale=1, rotateDismissed=false;
function fit(){
  const wrap=document.getElementById("wrap");
  scale=Math.max(0.2, Math.min(wrap.clientWidth/W, wrap.clientHeight/H));
  const dpr=window.devicePixelRatio||1;
  cv.style.width=(W*scale)+"px"; cv.style.height=(H*scale)+"px";
  cv.width=Math.round(W*scale*dpr); cv.height=Math.round(H*scale*dpr);
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  const portrait=window.innerHeight>window.innerWidth*1.1;
  document.getElementById("rotate").hidden=!(portrait && !rotateDismissed);
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function zoneFor(x,rim){
  if((rim.dir>0 && x>rim.x+4)||(rim.dir<0 && x<rim.x-4)) return ZONES.behind;   // past the rim: the backboard is in the way
  const xx=rim.dir>0?x:W-x; return xx>THREE?ZONES.inside:(xx>HALF?ZONES.mid:ZONES.far);
}
function rot(lx,ly,a,ox,oy){const c=Math.cos(a),s=Math.sin(a);return {x:ox+lx*c-ly*s,y:oy+lx*s+ly*c};}
function handPos(e,dir,charging){const k=(e===d&&BOSS)?BS.size:((e===p&&PS)?PS.size:1); return rot((charging?dir*4:dir*14)*k, (charging?-74:-58)*k, e.lean, e.x, e.y);}
function shotPath(x0,y0,tx,ty){const T=0.75+Math.abs(tx-x0)/900;return {vx:(tx-x0)/T, vy:(ty-y0-0.5*GB*T*T)/T, T};}
function targetFor(power,range,auto){
  if(auto) return RR.x+80;
  if(power>=range[0]&&power<=range[1]) return RR.x;
  // the further off the timing, the further off the aim: just early = front of the rim, just late = back of the rim
  return power<range[0] ? RR.x-(20+(range[0]-power)*1.5) : RR.x+Math.min(15,11.8+Math.random()*2.6+(power-range[1])*0.4);   // just late: onto the back of the rim, sometimes it rattles in
}

function body(e,dt){if(!e.ground){e.vy+=G*dt;e.y+=e.vy*dt;if(e.y>=FLOOR){e.y=FLOOR;e.vy=0;e.ground=true;}}}
function pickSpot(){
  const r=Math.random();
  if(BOSS && BS.deep) return r<0.25?130+Math.random()*140:(r<0.8?300+Math.random()*110:430+Math.random()*50);   // Deep Range likes the long ones
  if(r<0.6) return 130+Math.random()*140;
  if(r<0.95) return 300+Math.random()*110;
  return 430+Math.random()*50;

// who is defending, and is their arm up
function cpuDefending(){return owner===p || (ball.state==="flight"&&ball.shooter===p);}
function playerDefending(){return owner===d || (ball.state==="flight"&&ball.shooter===d);}
function cpuArmUp(){return cpuOn && cpuDefending() && (!d.ground || charge.on || dunk.on || ball.state==="flight");}
function playerArmUp(){return playerDefending() && (!p.ground || cpu.charging || cdunk.on || ball.state==="flight");}
function cpuHand(){const S=BOSS?BS.size:1, A=BOSS?BS.arm*(sig.on==="block"&&BOSS.sv.reach?1.3:1):1; return {x:d.x+20*A*(d.face||-1),y:d.y-84*S-(A-1)*30};}
function playerHand(){const S=PS?PS.size:1, A=PS?PS.arm:1; return {x:p.x+20*A*(p.face||1),y:p.y-84*S-(A-1)*30};}
// Which way each player faces (1 = right, -1 = left).
// Defending: face the ball handler, so from behind you turn and chase him, and once past him you face him.
// With the ball: face the way you're going (always towards the hoop when shooting or dunking).
// Loose ball: face the ball.
p.face=1; d.face=-1;
function updateFacing(joy){
  const pDef = owner===d || (ball.state==="flight" && ball.shooter===d);
  if(dunk.on || charge.on) p.face=1;
  else if(tip.on) p.face=Math.sign(d.x-p.x)||1;
  else if(owner===p) p.face = joy<-0.3?-1:(joy>0.3?1:p.face);
  else if(cpuOn && pDef) p.face=Math.sign(d.x-p.x)||p.face;
  else if(Math.abs(joy)>0.3) p.face=Math.sign(joy);
  else if(ball.state==="free" && Math.abs(ball.x-p.x)>6) p.face=Math.sign(ball.x-p.x);
  if(!cpuOn) return;
  const dDef = owner===p || (ball.state==="flight" && ball.shooter===p);
  if(cdunk.on || cpu.charging) d.face=-1;
  else if(tip.on) d.face=Math.sign(p.x-d.x)||-1;
  else if(owner===d) d.face = Math.abs((d.spd||0))>15 ? Math.sign(d.spd) : -1;
  else if(dDef) d.face=Math.sign(p.x-d.x)||d.face;
  else if(ball.state==="free" && Math.abs(ball.x-d.x)>6) d.face=Math.sign(ball.x-d.x);
}

function inbound(who){
  ball.state="held"; ball.live=false; charge.on=false; cpu.charging=false; d.jumped=false; d.react=null;
  p.lean=0; d.lean=0; dunk.on=false; cdunk.on=false;
  p.y=FLOOR; p.vy=0; p.ground=true; d.y=FLOOR; d.vy=0; d.ground=true;
  if(who==="p"||!cpuOn){owner=p; p.x=380; d.x=440;}
  else {owner=d; d.x=470; p.x=360; setCpuPlan();}
}
// ---------- jump ball to start a game: the referee whistles and tosses the ball up between the two players ----------
const TIP_X=422, TIP_Y=70, TIP_COUNT=3;   // the ball hangs this high, then drops after a 3-2-1 countdown
let tip={on:false,t:0,tt:0,tossed:false,whistled:false,cpuAt:99,fade:0};
function startTip(){
  owner=null; ball.state="tip"; ball.x=TIP_X; ball.y=TIP_Y; ball.vx=0; ball.vy=0;
  p.x=TIP_X-26; d.x=TIP_X+26; d.jumped=false; msg.t=0;
  // when the computer jumps after the drop: the perfect moment, plus a random error that gets smaller on later levels
  const ideal=0.1;
  tip={on:true,t:0,tt:0,tossed:false,whistled:false,beeps:0,fade:0,
    cpuAt: Math.random()<SKILL.noReact*0.5 ? 99 : Math.max(0,ideal+(Math.random()*2-1)*SKILL.timingNoise*0.55)};
}
function updateTip(dt){
  tip.t+=dt;
  if(!tip.tossed){
    ball.x=TIP_X; ball.y=TIP_Y+Math.sin(tip.t*5)*2; ball.rot=(ball.rot||0)+dt*1.5;   // hovering, gently bobbing
    if(tip.t>=tip.beeps && tip.beeps<TIP_COUNT){tip.beeps++; play("beep");}
    if(tip.t>=TIP_COUNT){tip.tossed=true; tip.tt=0; ball.vy=0; ball.y=TIP_Y; play("whistle");}
    return;
  }
  tip.tt+=dt;
  ball.vy+=GB*dt; ball.y+=ball.vy*dt; ball.rot=(ball.rot||0)+dt*3;
  if(!d.jumped && d.ground && tip.tt>=tip.cpuAt){cpuJump(-380); d.willDbl=false; d.jumped=true;}
  // whoever gets a hand to it first tips it to himself
  const ph=!p.ground?{x:p.x+20,y:p.y-84}:null, ch=!d.ground?{x:d.x-20,y:d.y-84}:null;
  const pt=ph && Math.hypot(ball.x-ph.x,ball.y-ph.y)<22, ct=ch && Math.hypot(ball.x-ch.x,ball.y-ch.y)<22;
  if(pt||ct){
    const w=(pt&&ct)?(ph.y<ch.y?p:(ch.y<ph.y?d:(Math.random()<0.5?p:d))):(pt?p:d);
    endTip(w); return;
  }
  if(ball.vy>0 && ball.y>FLOOR-70) endTip(null);   // nobody touched it
}
function drawCountdown(){
  if(!tip.on || tip.tossed) return;
  const n=Math.max(1,TIP_COUNT-Math.floor(tip.t)), frac=tip.t%1, size=58+(1-frac)*26;
  ctx.save(); ctx.globalAlpha=Math.min(1,(1-frac)*3);
  ctx.font=DISP(size); ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.lineWidth=8; ctx.lineJoin="round"; ctx.strokeStyle=C.navy; ctx.strokeText(String(n),TIP_X,TIP_Y+70);
  ctx.fillStyle=C.warn; ctx.fillText(String(n),TIP_X,TIP_Y+70);
  ctx.restore();
  if(BOSS){ctx.save(); ctx.font=DISP(18); ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.lineWidth=6; ctx.lineJoin="round";
    ctx.strokeStyle=C.navy; ctx.strokeText("BOSS GAME: "+NAME.d.toUpperCase(),TIP_X,TIP_Y+128); ctx.fillStyle=C.ink; ctx.fillText("BOSS GAME: "+NAME.d.toUpperCase(),TIP_X,TIP_Y+128); ctx.restore();}
}
function endTip(w){
  tip.on=false; tip.fade=0.6;
  if(w){
    play("smack"); takeBall(w);
    say((w===p?NAME.p:NAME.d)+" wins the tip!", w===p?"Your ball, go score on the right hoop":"Get in front of him: JUMP to block, or STEAL", w===p?C.info:C.warn);
  } else {
    ball.state="free"; ball.vx=(Math.random()-0.5)*80; ball.vy=0; ball.timer=0.2; ball.live=false;
    say("Nobody got it!","Loose ball, go and grab it",C.warn);
  }
}
function takeBall(e){
  owner=e; ball.state="held"; ball.live=false;
  if(e===d){setCpuPlan(); d.lean=0; say(NAME.d+"'s ball!","Get in front of him: JUMP to block, or STEAL",C.warn);
    if(sig.on==="reb"){ if(BOSS.sv.dunk && d.x<300){cpu.dunk=true; cpu.spot=clamp(d.x,115,155); cpuBurst=1.5;} else endSig(); }}
  else {say("Your ball!","Go score on the right hoop",C.info);}
}

    // a gentle EQ so nothing is harsh: soften the treble, take the edge off the top, add a touch of warmth

function makeLoop(b,trim,xf){
  const sr=b.sampleRate, s0=Math.floor(trim*sr), n=b.length-2*s0, x=Math.floor(xf*sr), len=n-x;

// how close the play is to the basket: 0 at centre court, 1 at the rim
function crowdProximity(){

  else if(ball.state==="flight"){ x=ball.x; y=ball.y; hoop=ball.shooter===p?RR:RL; }
  else if(ball.state==="made"||ball.state==="drop") return 0.6;

const WIND_MAKE=0.4;   // a windmill is harder to finish than a normal dunk (0.5)

  ctx.save(); ctx.globalAlpha=e>1.6?Math.max(0,(CRACK_T-e)/0.4):1; ctx.lineJoin="round"; ctx.lineCap="round";
  const partial=l=>{ctx.beginPath(); ctx.moveTo(l.pts[0][0],l.pts[0][1]);
    for(let i=1;i<l.pts.length;i++){
      if(l.cum[i]<=reach){ctx.lineTo(l.pts[i][0],l.pts[i][1]); continue;}
      const u=(reach-l.cum[i-1])/(l.cum[i]-l.cum[i-1]); ctx.lineTo(l.pts[i-1][0]+(l.pts[i][0]-l.pts[i-1][0])*u, l.pts[i-1][1]+(l.pts[i][1]-l.pts[i-1][1])*u); break;}
    ctx.stroke();};
  for(const [w,col] of [[3.2,"rgba(0,0,0,0.38)"],[1.5,"rgba(255,255,255,0.95)"]]){
    ctx.strokeStyle=col; ctx.lineWidth=w;

    for(const {r,ring} of crackFx.rings) if(reach>=r*1.15){ctx.beginPath(); ring.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath(); ctx.stroke();}
    if(all) for(const b of crackFx.branches){ctx.beginPath(); b.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke();}
  }

  const glow=Math.min(60,18+reach*0.25), g=ctx.createRadialGradient(crackFx.cx,crackFx.cy,0,crackFx.cx,crackFx.cy,glow);
  g.addColorStop(0,"rgba(255,255,255,0.8)"); g.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(crackFx.cx,crackFx.cy,glow,0,Math.PI*2); ctx.fill();
  if(all && e<CRACK_ALL+0.15){ctx.fillStyle="rgba(255,255,255,"+(0.45*(1-(e-CRACK_ALL)/0.15)).toFixed(3)+")"; ctx.fillRect(0,0,W,H);}

// where the hand (and ball) is during a windmill: from overhead, 180 degrees round behind the back to down low,
// then forward and up over the top into the rim
function windmillHand(dk,e,dir,rim){
  const sx=e.x+dir*6, sy=e.y-47, L=34;
  if(dk.t<RISE){
    // under and over: the ball drops down by the hip, then swings back behind and up over the top
    const u=Math.min(1,Math.max(0,(dk.t-dk.w0)/Math.max(0.08,RISE-dk.w0)));
    const down={x:sx, y:sy+L};
    if(u<0.22){const k=u/0.22, from={x:e.x+dir*10,y:e.y-96}; return {x:from.x+(down.x-from.x)*k, y:from.y+(down.y-from.y)*k};}
    const th=Math.PI/2+Math.PI*((u-0.22)/0.78);   // down -> behind -> straight up
    return {x:sx+dir*Math.cos(th)*L, y:sy+Math.sin(th)*L};
  }
  const u=Math.min(1,(dk.t-RISE)/SLAM), th=-Math.PI/2+Math.PI*0.45*u, k=u*u;   // from up, forward and down into the rim
  const arm={x:sx+dir*Math.cos(th)*L, y:sy+Math.sin(th)*L};
  return {x:arm.x+(rim.x-arm.x)*k, y:arm.y+(rim.y-6-arm.y)*k};
}

// ---------- stealing ----------
function trySteal(joy,joyY){
  if(stealCool>0) return;
  const toward=Math.sign(d.x-p.x)||1;
  const diagonal = joyY>0.45 && joy*toward>0.3;   // down and towards the ball handler
  stealSwipe=0.3; stealCool=STEAL_COOLDOWN;
  if(!diagonal){stealMsg={text:"Pull the joystick down towards him!",t:1.2}; return;}
  if(Math.abs(d.x-p.x)>STEAL_REACH*(PS?PS.arm:1)){stealMsg={text:"Too far away!",t:1}; return;}
  // he can only lose it while dribbling, not once the ball is up for a shot
  const chance = (cpu.charging||!d.ground) ? 0 : Math.min(0.9,SKILL.stealChance*(PS&&PS.pick?1+PS.pick*1.6:1));
  if(Math.random()<chance){
    play("swipe"); play("squeak"); play("cheer",0.8);
    stats.stl++; owner=p; ball.state="held"; ball.live=false; needRelease=true;
    cpu.charging=false; charge.on=false;
    say(pick("steal"),"You stole it from "+NAME.d+"!",C.info);
    setMood(p,"happy"); setMood(d,"shock"); celebrateFor(p);
    lastShot="Steal by "+NAME.p;
  } else {
    play("swipe"); stealMsg={text:pick("stealMiss"),t:1};
  }
}

// ---------- player shooting ----------
function startCharge(){
  charge.on=true; charge.power=0; charge.holdT=0; charge.zone=zoneFor(p.x,RR);
  d.jumped=false;
  // The defender doesn't read your power bar: sometimes he doesn't react at all,
  // otherwise he guesses a moment to jump somewhere in the hold.
  // He guesses roughly when you'll let go (from the middle of the sweet spot), with random error.
  const z=charge.zone, est=(z.n[0]+z.n[1])/200*(z.fill||FILL);
  d.react = Math.random()<SKILL.noReact ? null : Math.max(0.2, est-0.2+(Math.random()*2-1)*SKILL.timingNoise);
  if(PS && PS.hold<1 && Math.random()<PS.s*1.6) d.react=null;   // Quick Release: the shot is gone before he can jump
  if(BOSS && Math.abs(d.x-p.x)<140 && sigReady("block")){fireSig(); d.react=Math.max(0.2,est-0.12);}
}
function release(auto){

  Object.assign(ball,{state:"flight",x0:h.x,y0:h.y,x:h.x,y:h.y,vx:sp.vx,vy:sp.vy,T:sp.T,t:0,make,pts:z.pts,timer:0,
    shooter:p,missType,dunk:false,wind:false,lucky:false,live:false,saveTried:false,fade:charge.fade,far:z===ZONES.far});
  owner=null; stats.att++;
  charge.lastPower=pw; charge.shown=1.2; charge.range=range; charge.zone=z;
  lastShot = z.behind ? "No shot from behind the basket: get in front of it" : auto ? "Held too long: the ball flew off at 100"
    : "Let go at "+Math.round(pw)+" · needed "+range[0]+"–"+range[1]+(charge.fade?" (fade-away)":"");

}
// ---------- computer shooting ----------
function cpuRelease(){
  const z=zoneFor(d.x,RL), h=handPos(d,-1,true);
  let chance=Math.min(0.95,z.cpu*SKILL.acc*(cpu.fade?0.85:1)*(BOSS&&BS.deep&&z!==ZONES.inside?1+BS.deep*1.5:1));
  if(sig.on==="shot"){chance=z===ZONES.far?0.6:0.9; sig.n--; if(sig.n<=0) endSig();}
  const make=Math.random()<chance;
  const s=Math.random()<0.5?-1:1, tx=make?RL.x:(s>0?RL.x+20+Math.random()*16:RL.x-Math.min(15,11.8+Math.random()*2.6));   // front of the rim, or back of the rim

    shooter:d,missType:over?"long":"short",dunk:false,wind:false,lucky:false,live:false,fade:cpu.fade,far:z===ZONES.far});

// ---------- ball physics: rims, backboards and floor ----------
// How much speed the ball keeps when it bounces (coefficient of restitution), based on real basketball
// measurements: a steel rim gives back about 55%, the glass backboard about 75%, a hardwood floor about 78%.
const BOUNCE={rim:0.55, board:0.75, floor:0.78, net:0.15}, RIM_GRIP=0.88, BALL_R=8, RIM_Y=186;
const HOOPS=[   // each hoop: the front and back edge of the rim, and the face of the backboard
  {rim:RR, net:1, edges:[[737,RIM_Y],[775,RIM_Y]], face:777, faceDir:-1, top:140, bot:202},
  {rim:RL, net:0, edges:[[107,RIM_Y],[69,RIM_Y]],  face:67,  faceDir:1,  top:140, bot:202}
];
// bounce the ball off a small round point (a rim edge or a backboard corner)
function hitPoint(px,py,r,e){
  const dx=ball.x-px, dy=ball.y-py, dd=Math.hypot(dx,dy), min=BALL_R+r;
  if(dd>=min||dd<0.001) return false;
  const nx=dx/dd, ny=dy/dd; ball.x=px+nx*min; ball.y=py+ny*min;
  const vn=ball.vx*nx+ball.vy*ny; if(vn>=0) return false;
  // reverse the part of the speed going into the rim (losing some), keep most of the part along it
  const tx=ball.vx-vn*nx, ty=ball.vy-vn*ny;
  ball.vx=-e*vn*nx+tx*RIM_GRIP; ball.vy=-e*vn*ny+ty*RIM_GRIP;
  if(Math.hypot(ball.vx,ball.vy)<70) ball.vx+=(ball.x<px?-1:1)*45;   // a ball never balances on the rim
  return true;
}
function collideHoops(){
  let hit=null;
  for(const h of HOOPS){
    for(const [px,py] of h.edges) if(hitPoint(px,py,2.5,BOUNCE.rim)){hit="rim"; netKick(h.net,1.5,0); play("rim",Math.hypot(ball.vx,ball.vy)/BOUNCE.rim);}
    if(ball.y>h.top && ball.y<h.bot){   // the glass
      const back=h.face-h.faceDir*7;   // the back of the board
      if(h.faceDir<0 && ball.x-BALL_R<back && ball.x>h.face+3 && ball.vx<0){ball.x=back+BALL_R; ball.vx=-ball.vx*BOUNCE.board; hit=hit||"board"; play("board",Math.abs(ball.vx)/BOUNCE.board);}
      if(h.faceDir>0 && ball.x+BALL_R>back && ball.x<h.face-3 && ball.vx>0){ball.x=back-BALL_R; ball.vx=-ball.vx*BOUNCE.board; hit=hit||"board"; play("board",Math.abs(ball.vx)/BOUNCE.board);}
      if(h.faceDir<0 && ball.x+BALL_R>h.face && ball.x<h.face+7 && ball.vx>0){ball.x=h.face-BALL_R; ball.vx=-ball.vx*BOUNCE.board; ball.vy*=0.92; hit=hit||"board"; play("board",Math.abs(ball.vx)/BOUNCE.board);}
      if(h.faceDir>0 && ball.x-BALL_R<h.face && ball.x>h.face-7 && ball.vx<0){ball.x=h.face+BALL_R; ball.vx=-ball.vx*BOUNCE.board; ball.vy*=0.92; hit=hit||"board"; play("board",Math.abs(ball.vx)/BOUNCE.board);}
    }
    for(const cy of [h.top,h.bot]) if(hitPoint(h.face-h.faceDir*3.5,cy,3.5,BOUNCE.board)) hit=hit||"board";
    const fx=h.edges[0][0];   // the net hangs from the front of the rim, slanting in, and soaks up most of the speed
    for(const [dx,dy] of [[2,10],[4,20],[6,28]]) if(hitPoint(fx-h.faceDir*dx,RIM_Y+dy,2,BOUNCE.net)){hit=hit||"net"; netKick(h.net,1,0);}
  }
  return hit;
}
function floorAndWalls(){
  if(ball.y>FLOOR-BALL_R){
    ball.y=FLOOR-BALL_R;
    if(ball.vy>0){play("bounce",ball.vy); ball.vy=-ball.vy*BOUNCE.floor; ball.vx*=0.9;}
    if(Math.abs(ball.vy)<35) ball.vy=0;
  }
  if(ball.x<8){ball.x=8; ball.vx=Math.abs(ball.vx)*0.6;}
  if(ball.x>836){ball.x=836; ball.vx=-Math.abs(ball.vx)*0.6;}
}
// after a miss, a ball that bounces around and drops through its own hoop still counts
function checkRollIn(prevY){
  if(ball.missType==="behind") return;   // a shot from behind can't sneak in
  const h=ball.shooter===p?HOOPS[0]:HOOPS[1], a=Math.min(h.edges[0][0],h.edges[1][0]), b=Math.max(h.edges[0][0],h.edges[1][0]);
  if(ball.vy>0 && prevY<RIM_Y && ball.y>=RIM_Y && ball.x>a+5 && ball.x<b-5){
    ball.make=true; ball.lucky=true; ball.live=false; arrive(0);
  }
}

// ---------- update ----------
function update(dt){
  crowdUpdate(dt);   // the crowd follows the play
  if(screen!=="play"){updateNets(dt); return;}
  if(gameOverT>0){gameOverT-=dt; if(gameOverT<=0){endGame(); return;}}
  if(pendingInbound){inboundT-=dt; if(inboundT<=0){const w=pendingInbound;pendingInbound=null; if(gameOverT<=0) inbound(w);}}
  const joy=clamp(touchJoy||keyJoy,-1,1), joyY=clamp(touchJoyY||keyJoyY,-1,1);
  const shootDown=shootKey||shootTouch;

  if(stealCool>0) stealCool-=dt;

  if(pressed && cpuOn && owner===d && ball.state==="held" && !cdunk.on) trySteal(joy,joyY);

  // player
  if(!shootDown) needRelease=false;
  if(dunk.on && !dunk.wind && !dunk.resolved && dunk.t<RISE*0.8 && joyY<-0.5){
    dunk.wind=true; dunk.w0=dunk.t; dunk.success=Math.random()<pWindChance(); lastShot="WINDMILL! · "+Math.round(pWindChance()*100)+"% chance";
  }
  if(dunk.on) updateDunk(dt);
  else {
    if(!tip.on) p.x=clamp(p.x+joy*(charge.on?70:170)*dt*playerSpeedK(joy)*(PS?PS.speed*(ball.state==="free"?1+PS.reb*1.5:1):1),24,812);
    if(jumpQueued && p.ground){p.vy=-380*(PS?PS.jump:1);p.ground=false;p.dbl=false; play("squeak");}
    else if(jumpQueued && !p.ground && !p.dbl && playerDefending()){
      // double jump: only works if the second tap lands near the top of the first jump
      if(apexWindow()){p.vy=-380*(PS?PS.jump:1); p.dbl=true; dblFx={t:0.45,x:p.x,y:p.y};}
      else {p.dbl=true; dblMiss=0.6;}
    }
    // jump shot hang time: while powering up in the air the player freezes, and drops after the release
    if(charge.on && !p.ground){   // jump shot: keep rising normally, then float down slowly while the bar fills
      p.vy = p.vy<0 ? p.vy+G*dt : Math.min(p.vy+G*0.15*dt, 55);
      p.y+=p.vy*dt; if(p.y>=FLOOR){p.y=FLOOR; p.vy=0; p.ground=true;}
    }
    else body(p,dt);
  }
  jumpQueued=false;
  if(shakeT>0) shakeT-=dt;

  if(owner===p && ball.state==="held" && !dunk.on){
    if(shootDown && !charge.on && !needRelease && p.ground && inKey(p.x)) startDunk();
    else if(shootDown && !charge.on && !needRelease) startCharge();
    if(charge.on){
      const before=charge.power; charge.power+=dt/(zoneFor(p.x,RR).fill||FILL)*100; charge.holdT+=dt;
      {const z=zoneFor(p.x,RR), lo=(pRange(z,charge.fade))[0]; if(before<lo && charge.power>=lo) play("tick");}
      charge.fade=joy<-0.35; charge.zone=zoneFor(p.x,RR);
      if(!shootDown) release(false);
      else if(charge.power>=100){charge.power=100;release(true);}
    }
  } else if(charge.on && owner!==p){charge.on=false;}
  p.lean+=(((charge.on&&charge.fade)?-0.25:0)-p.lean)*Math.min(1,dt*12);
  if(BOSS && pStun>0) p.lean=Math.sin(performance.now()/45)*0.14;   // wobbly ankles
  if(charge.shown>0) charge.shown-=dt;

  // Ankle Breaker: change direction sharply right in front of him and he can fall for it
  if(PS && PS.ankle && cpuOn && owner===p && ball.state==="held" && !charge.on && !dunk.on && d.x>p.x && d.x-p.x<90 && Math.abs(joy)>0.5){
    if(pJoyLast*joy<0 && dStunCool<=0 && Math.random()<PS.ankle*2.2){
      dStun=0.6+PS.ankle; dStunCool=3; say("ANKLES BROKEN!",NAME.p+" crossed "+NAME.d+" over!",C.info); play("squeak"); play("gasp"); setMood(d,"shock"); setMood(p,"happy");
    }
  }
  if(Math.abs(joy)>0.5) pJoyLast=joy;
  // computer
  if(cpuOn){ bossTick(dt); cpuUpdate(dt); }
  updateFacing(joy);

  // ball
  if(ball.state==="held"){
    let h;
    if(owner===p && dunk.on && dunk.wind) h=windmillHand(dunk,p,1,RR);
    else if(owner===d && cdunk.on && cdunk.wind) h=windmillHand(cdunk,d,-1,RL);
    else if(owner===p && dunk.on){
      const kp=PS?PS.size:1, a={x:p.x+10*kp,y:p.y-96*kp};
      if(dunk.t<RISE) h=a;
      else {const u=Math.min(1,(dunk.t-RISE)/SLAM); h={x:a.x+(RR.x-a.x)*u, y:a.y+(RR.y-6-a.y)*u};}
    } else if(owner===d && cdunk.on){
      const k=BOSS?BS.size:1, a={x:d.x-10*k,y:d.y-96*k};
      if(cdunk.t<RISE) h=a;
      else {const u=Math.min(1,(cdunk.t-RISE)/SLAM); h={x:a.x+(RL.x-a.x)*u, y:a.y+(RL.y-6-a.y)*u};}
    } else {
      const e=owner, charging=e===d?cpu.charging:charge.on, dir=charging?(e===d?-1:1):(e.face||(e===d?-1:1));
      h = (!charging && e.ground) ? dribblePos(e,dir,dt) : handPos(e,dir,charging);
    }
    ball.x=h.x; ball.y=h.y; ball.rot=(ball.rot||0)+dt*2.5;
  } else if(ball.state==="flight"){
    ball.rot=(ball.rot||0)-Math.sign(ball.vx||1)*9*dt; // backspin
  }

  else if(ball.state==="made"){ ball.rot=(ball.rot||0)+dt*2; }
  if(ball.state==="held"){
  } else if(ball.state==="flight"){
    ball.t+=dt; const t=ball.t;
    let hit=null;
    if(ball.make){ ball.x=ball.x0+ball.vx*t; ball.y=ball.y0+ball.vy*t+0.5*GB*t*t; }
    else {   // small steps so the ball can't skip through the rim
      const n=4, h=dt/n;
      for(let k=0;k<n && !hit;k++){ ball.vy+=GB*h; ball.x+=ball.vx*h; ball.y+=ball.vy*h; hit=collideHoops(); }
    }
    const early=t<ball.T*0.55;
    // the save: the ball is coming down close to the hoop, and a defender's hand gets to it above the rim
    const rimX=ball.shooter===p?RR.x:RL.x, vyNow=ball.make?ball.vy+GB*t:ball.vy;
    const saveZone=vyNow>0 && Math.abs(ball.x-rimX)<95 && ball.y<RIM_Y+2;
    if((early||saveZone) && ball.shooter===p && cpuArmUp()){
      const hd=cpuHand();
      const fadeK=(ball.fade&&PS&&PS.fade)?Math.max(0.35,1-PS.fade*1.3):1;
      if(Math.hypot(ball.x-hd.x,ball.y-hd.y)<(BOSS?BS.blockR+(sig.on==="block"?12:0):18)*fadeK){blocked(d,!early);return;}
    }
    if((early||saveZone) && ball.shooter===d && playerArmUp()){
      const hd=playerHand();
      if(Math.hypot(ball.x-hd.x,ball.y-hd.y)<(PS?PS.blockR:18)*(ball.fade&&BOSS&&BS.fade?Math.max(0.35,1-BS.fade*1.3):1)){blocked(p,!early);return;}
    }
    if(ball.make){ if(t>=ball.T) arrive(t); }
    else if(hit || t>=ball.T+0.25 || ball.y>FLOOR-BALL_R) missNow();
  } else if(ball.state==="free"){
    ball.timer+=dt;
    const n=4, h=dt/n;
    for(let k=0;k<n;k++){
      const prevY=ball.y;
      ball.vy+=GB*h; ball.x+=ball.vx*h; ball.y+=ball.vy*h;
      collideHoops(); floorAndWalls();
      if(ball.live && ball.timer<4) checkRollIn(prevY);
      if(ball.state!=="free") break;
    }
    if(ball.y>=FLOOR-BALL_R-0.5 && ball.vy===0) ball.vx*=Math.max(0,1-1.3*dt);   // rolling slows down on the floor
    if(ball.state!=="free"){}   // it just rolled in: nobody can grab it
    else if(!cpuOn){ if(ball.timer>1.6) inbound("p"); }
    else if(ball.timer>0.25){
      for(const e of [p,d]){
        const R=(e===d&&BOSS)?24+BS.reb*40+(sig.on==="reb"?30:0):((e===p&&PS)?24+PS.reb*40:24);
        const Hh=(e===d&&BOSS)?92*BS.size+(BS.arm-1)*30:((e===p&&PS)?92*PS.size+(PS.arm-1)*30:92);
        if(Math.abs(ball.x-e.x)<R && ball.y>e.y-Hh){takeBall(e);break;}
      }

    }
  } else if(ball.state==="made"){
    // ball slides down through the net, then drops out of the bottom

  }
  updateNets(dt); updateFx(dt); if(tip.fade>0) tip.fade-=dt;
  if(msg.t>0) msg.t-=dt;
  if(celebrate.t>0) celebrate.t-=dt;
  if(dblFx.t>0) dblFx.t-=dt;
  if(cpuFx.t>0) cpuFx.t-=dt;
  if(dblMiss>0) dblMiss-=dt;
  for(const s of [moods.p,moods.d]) if(s.t>0){s.t-=dt; if(s.t<=0) s.m="happy";}

}
function trackRun(dt){
  for(const e of [p,d]){
    if(e.lx===undefined) e.lx=e.x;
    e.spd=(e.x-e.lx)/Math.max(dt,0.001); e.lx=e.x;
    e.run=(e.run||0)+Math.abs(e.spd)*dt*0.09;
  }
}

function startDunk(){
  Object.assign(dunk,{on:true,t:0,x0:p.x,success:Math.random()<pDunkChance(),resolved:false,hang:0,wind:false,w0:0});
  p.ground=false; p.vy=0; needRelease=true; stats.att++; d.jumped=false;
  lastShot="Dunk attempt · "+Math.round(pDunkChance()*100)+"% chance";
  if(BOSS && sigReady("dunkblock")) fireSig();
}
function startCpuDunk(){
  const wind=Math.random()<SKILL.windTry || !!(sig.on==="fast" && BOSS.sv.wind);   // the computer sometimes goes for a windmill too
  const boost=(sig.on==="fast"||sig.on==="reb")?0.3:0;
  Object.assign(cdunk,{on:true,t:0,x0:d.x,success:Math.random()<(wind?WIND_MAKE:SKILL.dunkMake)+boost,resolved:false,hang:0,wind,w0:0.06});
  if(boost) endSig();
  d.ground=false; d.vy=0;
  lastShot=NAME.d+" is going for the dunk!";
}
function updateDunk(dt){ runDunk(dunk,p,1,RR,DUNK_X,dt); }
function runDunk(dk,e,dir,rim,dunkX,dt){
  dk.t+=dt; const t=dk.t;
  if(t<RISE){
    const u=t/RISE;
    e.x=dk.x0+(dunkX-dk.x0)*(1-(1-u)*(1-u));
    e.y=FLOOR-85*Math.sin(u*Math.PI/2);
  } else if(t<RISE+SLAM){
    const u=(t-RISE)/SLAM; e.x=dunkX; e.y=FLOOR-85+45*u;
  } else {
    if(!dk.resolved) resolveDunk(dk,e,dir,rim,dunkX);
    const t2=t-RISE-SLAM;
    if(t2<dk.hang){e.x=dunkX;e.y=FLOOR-40;}
    else {
      const u=Math.min(1,(t2-dk.hang)/DROP); e.x=dunkX-dir*10*u; e.y=FLOOR-40+40*u*u;
      if(u>=1){e.y=FLOOR;e.ground=true;e.vy=0;dk.on=false;}
    }
  }
}
function resolveDunk(dk,e,dir,rim,dunkX){
  dk.resolved=true;
  const byP=e===p;
  // the defender can stuff a dunk: the CPU has a small chance if it is close,
  // you get a bigger chance if you are in the air near the rim at the slam
  const stuffed = byP
    ? (cpuOn && Math.abs(d.x-dunkX)<(sig.on==="dunkblock"?140:80) && Math.random()<(sig.on==="dunkblock"?1:SKILL.blockDunk))
    : (!p.ground && Math.abs(p.x-dunkX)<75 && Math.random()<0.5);
  if(stuffed){
    dk.hang=0.02; shakeT=0.15; owner=null; if(byP) stats.streak=0;
    Object.assign(ball,{state:"free",x:rim.x-dir*14,y:rim.y-10,vx:-dir*(120+Math.random()*60),vy:-120,timer:0,dunk:true,live:false});
    say(pick("block"), byP?"Stuffed at the rim!":"You stuffed "+NAME.d+"'s dunk!", byP?C.warn:C.info);
    lastShot = byP ? "Your dunk was blocked" : "You blocked "+NAME.d+"'s dunk"; if(!byP) stats.blk++;
    setMood(e,"shock"); setMood(byP?d:p,"happy"); celebrateFor(byP?d:p);
    return;
  }
  dk.hang=dk.success?0.32:0.02; shakeT=dk.success?0.3:0.12;
  Object.assign(ball,{shooter:e,make:dk.success,pts:2,far:false,fade:false,dunk:true,wind:!!dk.wind});
  if(dk.success){ startBoardFx(byP?"R":"L",dk.wind); if(dk.wind) startCrackFx(); arrive(0); }
  else {
    owner=null; if(byP) stats.streak=0;
    Object.assign(ball,{state:"free",x:rim.front-dir*4,y:rim.y-8,vx:-dir*(150+Math.random()*90),vy:-280,timer:0,live:false});
    say(pick("dunkMiss"), byP?(cpuOn?"Grab the rebound!":"50/50, try again!"):NAME.d+" missed the dunk! Grab it!", byP?C.warn:C.info);
    lastShot = byP ? "Dunk missed" : NAME.d+" missed the dunk";
    setMood(e,"grump");
  }
}
function setCpuPlan(){
  cpu.charging=false;
  cpu.dunk=Math.random()<SKILL.dunkTry;
  cpu.spot=cpu.dunk ? 115+Math.random()*40 : pickSpot();
  if(BOSS){
    if(sig.on==="shot" && sig.n>0){cpu.dunk=false; cpu.spot=sig.x;}   // Heat Check: the same spot again
    else if(sigReady("shot")){
      fireSig(); sig.n=BOSS.sv.repeat||1; sig.crossed=false; cpu.dunk=false; const sp=BOSS.sv.spot;
      sig.x=sp==="mid"?300+Math.random()*80:(sp==="deep"?380+Math.random()*50:(sp==="far"?440+Math.random()*40:pickSpot()));
      cpu.spot=sig.x;
    }
    else if(sigReady("fast")){fireSig(); cpu.dunk=true; cpu.spot=115+Math.random()*30; cpuBurst=3;}
  }
}
function blocked(by,save){
  play("smack"); play("gasp");
  const shooterDir = ball.shooter===p ? 1 : -1;
  ball.state="free"; ball.timer=0; ball.live=false;
  if(save){ball.vx=-shooterDir*(140+Math.random()*70); ball.vy=-90;}   // swatted away from the hoop
  else {ball.vx=shooterDir*60; ball.vy=60;}
  if(by===d){
    stats.streak=0;
    say(pick(save?"save":"block"),save?NAME.d+" saved it at the rim!":"Blocked! Try a fade-away: pull back while you hold SHOOT",C.warn);
    lastShot=save?"Saved by "+NAME.d:"Blocked by the defender";
  } else {
    say(pick(save?"save":"block"),save?"What a save! Grab the ball!":"You blocked it! Grab the ball!",C.info);
    lastShot=(save?"You saved it from ":"You blocked ")+NAME.d; stats.blk++;
  }
  setMood(by===d?p:d,"shock"); setMood(by,"happy"); celebrateFor(by);
  if(by===d && sig.on==="block"){ if(BOSS.sv.catch) takeBall(d); endSig(); }   // Freeze: he catches it
}
function arrive(t){
  const byP=ball.shooter===p, rim=byP?RR:RL;

    ball.state="made"; ball.x=rim.x; ball.y=rim.y; ball.timer=0;

    if(ball.dunk) play("slam"); else play("swish");
    play("cheer", ball.wind?1.8:(ball.dunk?1.4:(ball.far?1.6:(ball.lucky?0.8:(ball.pts===3?1.15:0.75)))));
    if(byP){
      stats.score+=ball.pts; stats.made++; if(ball.pts===3) stats.threes++; if(ball.dunk) stats.dunks++; stats.streak++; stats.best=Math.max(stats.best,stats.streak);
      const cat=ball.lucky?"lucky":ball.wind?"windmill":(ball.dunk?"dunk":(ball.far?"half":(ball.fade?"fade":(stats.streak>=3?"fire":(ball.pts===3?"three":"two")))));
      say(pick(cat), "+"+ball.pts+(stats.streak>1?" · "+stats.streak+" in a row":""), C.green);
      setMood(p,"happy"); setMood(d,"grump");
      if(BIG_PLAYS.includes(cat)) celebrateFor(p);
    } else {
      stats.cpu+=ball.pts;
      const cat=ball.lucky?"lucky":ball.wind?"windmill":(ball.dunk?"dunk":(ball.far?"half":(ball.fade?"fade":(ball.pts===3?"three":"two"))));
      say(pick(cat),NAME.d+" +"+ball.pts,C.warn);
      setMood(d,"happy"); setMood(p,"grump");
      if(BIG_PLAYS.includes(cat)) celebrateFor(d);
    }
    if(cpuOn && (stats.score>=WIN||stats.cpu>=WIN)){
      const youWin=stats.score>=WIN;
      say((youWin?NAME.p:NAME.d).toUpperCase()+" WINS!", stats.score+" – "+stats.cpu, youWin?C.green:C.warn);
      msg.t=3; gameOverT=3; SND.last.whistle=0; play("whistle",true);
      setMood(youWin?p:d,"happy",3); setMood(youWin?d:p,"grump",3); celebrateFor(youWin?p:d,3);

}
function missNow(){
  const byP=ball.shooter===p;

  ball.state="free"; ball.timer=0; ball.live=true;
  {
    if(byP){
      stats.streak=0;
      const tip={behind:"Get in front of the basket to shoot",auto:"Let go before the bar is full",air:"Way too early, hold a bit longer",short:"A little early, hold longer",long:"A little late, let go sooner"}[ball.missType];
      say(pick(ball.missType), tip+(cpuOn?" · grab the rebound!":""), C.warn); play("groan");
      setMood(p,"grump");
    } else {
      say(pick(ball.missType),NAME.d+" missed! Grab the rebound!",C.info);
      setMood(d,"grump");

// a defender jump; about 1 in 3 of them turns into a double jump at the top
function cpuJump(v){
  if(BOSS){ v*=BS.jump; if(cpuDefending() && sigReady("leap")) fireSig(); if(sig.on==="leap") v*=1.3; }
  d.vy=v; d.ground=false; d.dbl=false;
  d.willDbl=Math.random()<SKILL.dblChance || !!(BOSS && BOSS.sv.dbl && (sig.on==="leap"||sig.on==="block"));
}
function cpuUpdate(dt){
  if(tip.on){ updateTip(dt); body(d,dt); return; }
  if(cdunk.on){ runDunk(cdunk,d,-1,RL,CPU_DUNK_X,dt); return; }
  if(dStunCool>0) dStunCool-=dt;
  if(dStun>0){ dStun-=dt; if(cpuDefending()){ d.lean=Math.sin(performance.now()/45)*0.14; body(d,dt); return; } }
  if(owner===d && ball.state==="held"){
    // attacking the left hoop
    if(BOSS) bossAttack(dt);
    if(!cpu.charging){
      const glued=PS&&PS.glue&&p.x<d.x&&d.x-p.x<50;
      const step=SKILL.atkSpeed*dt*(cpuBurst>0?1.7:1)*(glued?Math.max(0.3,1-PS.glue*2):1);
      if(Math.abs(cpu.spot-d.x)<=step){
        d.x=cpu.spot;
        if(cpu.dunk && d.ground){ startCpuDunk(); return; }
        cpu.charging=true; cpu.t=0; cpu.hold=(0.9+Math.random()*0.5)*(BOSS?BS.hold*((sig.on==="shot"&&BOSS.sv.quick)?0.5:1):1);
        cpu.fade = (p.x<d.x && d.x-p.x<75 && Math.random()<SKILL.fadeChance) || !!(sig.on==="shot" && BOSS.sv.fade);
        if(sig.on==="shot" && BOSS.sv.cross && !sig.crossed){sig.crossed=true; crossover();}
      } else d.x+=Math.sign(cpu.spot-d.x)*step;
    } else {
      cpu.t+=dt; if(cpu.fade) d.x=Math.min(d.x+(40+(BOSS?BS.fade*150:0))*dt,800);
      if(cpu.t>=cpu.hold) cpuRelease();
    }
  } else if(ball.state==="flight" && ball.shooter===p){
    const target=RR.x+8, step=SKILL.chaseSpeed*dt;   // hand reaches just in front of the rim
    if(Math.abs(target-d.x)>step) d.x+=Math.sign(target-d.x)*step;
    if(!ball.saveTried && d.ground && ball.T-ball.t<=0.36 && Math.abs(d.x-target)<40){
      ball.saveTried=true; if(Math.random()<SKILL.saveChance) cpuJump(-380);
    }
  } else if(ball.state==="free"){
    const step=SKILL.chaseSpeed*dt*(BOSS?(1+BS.reb*2)*(sig.on==="reb"?2.4:1):1);
    if(Math.abs(ball.x-d.x)>step) d.x+=Math.sign(ball.x-d.x)*step;
  } else if(owner===p && ball.state==="held"){
    // defending the right hoop
    let target=clamp(p.x+60-(BOSS?BS.glue*60:0),60,800), step=SKILL.defSpeed*dt;
    if(sig.on==="dunkblock"){target=DUNK_X+24; step*=2.5;}
    if(!(BOSS && bossDefend(dt))){ if(Math.abs(target-d.x)<step) d.x=target; else d.x+=Math.sign(target-d.x)*step; }
    const close=d.x>p.x && d.x-p.x<110;
    // contest a dunk by jumping with it
    if(dunk.on && !d.jumped && d.ground && Math.abs(d.x-DUNK_X)<90 && dunk.t>0.08){cpuJump(-400);d.jumped=true;}
    if(charge.on && d.react!==null && !d.jumped && d.ground && charge.holdT>=d.react && close){
      cpuJump(-380); d.jumped=true;
    }
    // sometimes he bites on nothing and jumps anyway
    if(!charge.on && d.ground && close && Math.random()<0.22*dt){cpuJump(-380);}
  }
  // random double jump at the top of a block jump
  if(!d.ground && d.willDbl && !d.dbl && cpuDefending() && Math.abs(d.vy)<APEX_VY){
    d.vy=-380*(BOSS?BS.jump:1); d.dbl=true; cpuFx={t:0.45,x:d.x,y:d.y};
  }
  d.lean+=(((cpu.charging&&cpu.fade)?0.25:0)-d.lean)*Math.min(1,dt*12);
  body(d,dt);
}

function rr(x,y,w,h,r){ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h);}
function line(x1,y1,x2,y2,col,w){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function text(t,x,y,font,col,align){ctx.font=font;ctx.fillStyle=col;ctx.textAlign=align||"left";ctx.textBaseline="middle";ctx.fillText(t,x,y);}
const DISP=s=>s+'px Bungee, "Arial Black", Impact, sans-serif';
const BODY=(s,w)=>(w||800)+" "+s+'px Nunito, system-ui, sans-serif';
const NET=[[2,0,9,26],[13,0,16,26],[27,0,24,26],[38,0,31,26],[5,9,35,9],[7,18,33,18],[9,26,31,26]];
// ---------- nets: a hanging string mesh that the ball pushes through ----------
// Each net is a grid of points (top row tied to the rim) joined by diagonal strings that make the
// diamond pattern. Points move with simple verlet physics, are pulled gently back to their rest
// shape, and get shoved aside by the ball, so the net bulges, stretches and swings.
const NET_COLS=6, NET_ROWS=5;
function makeNet(rimX){
  const pts=[], links=[];
  for(let r=0;r<=NET_ROWS;r++){
    const w=40-(r/NET_ROWS)*17;               // tapers toward the bottom
    for(let c=0;c<=NET_COLS;c++){
      const x=rimX+20+(c/NET_COLS-0.5)*w, y=189+r*6.6;
      pts.push({x,y,px:x,py:y,rx:x,ry:y,fixed:r===0});
    }
  }
  const id=(r,c)=>r*(NET_COLS+1)+c;
  const link=(a,b,front)=>{const A=pts[a],B=pts[b]; links.push({a,b,len:Math.hypot(A.x-B.x,A.y-B.y),front});};
  for(let r=0;r<NET_ROWS;r++) for(let c=0;c<=NET_COLS;c++){
    if(c<NET_COLS){ link(id(r,c),id(r+1,c+1),true); link(id(r,c+1),id(r+1,c),false); }
    if(c===0||c===NET_COLS) link(id(r,c),id(r+1,c),true);   // side edges
  }
  for(let c=0;c<NET_COLS;c++) link(id(NET_ROWS,c),id(NET_ROWS,c+1),true); // bottom hem
  return {pts,links};
}
const NETS=[makeNet(67),makeNet(737)];
function netKick(i,down,side){
  for(const pt of NETS[i].pts){ if(pt.fixed) continue; const k=(pt.ry-189)/(NET_ROWS*6.6);
    pt.py-=down*k; pt.px-=(side||0)*k; }
}
function updateNets(dt){
  const loose=ball.state!=="held";
  for(const net of NETS){
    for(const pt of net.pts){
      if(pt.fixed) continue;
      const vx=(pt.x-pt.px)*0.9, vy=(pt.y-pt.py)*0.9;
      pt.px=pt.x; pt.py=pt.y;
      pt.x+=vx; pt.y+=vy+260*dt*dt;
      pt.x+=(pt.rx-pt.x)*0.07; pt.y+=(pt.ry-pt.y)*0.07;
      if(loose){
        const dx=pt.x-ball.x, dy=pt.y-ball.y, dd=Math.hypot(dx,dy);
        if(dd<10.5 && dd>0.01){pt.x=ball.x+dx/dd*10.5; pt.y=ball.y+dy/dd*10.5;}
      }
    }
    for(let it=0;it<3;it++) for(const L of net.links){
      const A=net.pts[L.a], B=net.pts[L.b], dx=B.x-A.x, dy=B.y-A.y, dd=Math.hypot(dx,dy)||1;
      if(dd<=L.len*1.08) continue;                  // strings can go slack but not stretch much
      const f=(dd-L.len*1.08)/dd*0.5;
      if(!A.fixed){A.x+=dx*f; A.y+=dy*f;}
      if(!B.fixed){B.x-=dx*f; B.y-=dy*f;}
    }
  }
}
function drawNetLayer(front){
  ctx.lineCap="round";
  ctx.strokeStyle=front?"rgba(250,248,242,0.95)":"rgba(205,212,228,0.55)";
  ctx.lineWidth=front?1.4:1.1;
  ctx.beginPath();
  for(const net of NETS) for(const L of net.links){
    if(L.front!==front) continue;
    const A=net.pts[L.a], B=net.pts[L.b];
    ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y);
  }
  ctx.stroke();
  if(front){ // little knots where the strings cross
    ctx.fillStyle="rgba(250,248,242,0.9)";
    for(const net of NETS) for(const pt of net.pts){ if(pt.fixed) continue; ctx.fillRect(pt.x-0.8,pt.y-0.8,1.6,1.6); }
  }
}
function drawHoop(side){
  const L=side==="L";
  const poleX=L?32:804, armX=L?38:782, boardX=L?60:777, rimX=L?67:737;
  ctx.fillStyle=C.steel; ctx.fillRect(poleX,168,8,142); ctx.fillRect(armX,168,24,6);
  if(!boardGone(side)){ctx.fillStyle=C.chalk; rr(boardX,140,7,62,2); ctx.fill();}
  else {ctx.fillStyle="rgba(205,235,255,0.8)"; ctx.fillRect(boardX,140,7,6); ctx.fillRect(boardX,196,7,6);}   // only jagged edges left
  ctx.fillStyle=C.ball; rr(rimX,184,40,5,3); ctx.fill();
  // net hooks under the rim
  ctx.fillStyle=C.chalk; for(let i=0;i<=NET_COLS;i++) ctx.fillRect(rimX+20+(i/NET_COLS-0.5)*40-1,188,2,3);
}

// two-segment limb from a joint to an end point, bending the middle joint toward (px,py)
function limb(sx,sy,ex,ey,L,prefX,prefY,w1,w2,col){
  const dx=ex-sx, dy=ey-sy, dist=Math.hypot(dx,dy)||1;
  let mx=sx+dx/2, my=sy+dy/2;
  if(dist<2*L){
    const h=Math.sqrt(L*L-(dist/2)*(dist/2)); let nx=-dy/dist, ny=dx/dist;
    if(nx*prefX+ny*prefY<0){nx=-nx;ny=-ny;}
    mx+=nx*h; my+=ny*h;
  }
  line(sx,sy,mx,my,col,w1); line(mx,my,ex,ey,col,w2);
  return {mx,my};
}
function drawAthlete(e,lk,hand,other,air,hang){
  const dir=lk.dir;
  ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(e.lean);
  // feet targets: standing, running stride, tucked in the air, or dangling from the rim
  let ff, bf;
  const moving=Math.abs(e.spd||0)>15;
  if(hang){ff={x:dir*3,y:2};bf={x:-dir*3,y:0};}
  else if(air){ff={x:dir*8,y:-9};bf={x:-dir*3,y:-4};}
  else if(moving){const s=Math.sin(e.run||0), c=Math.cos(e.run||0);
    ff={x:s*9,y:-Math.max(0,c)*6}; bf={x:-s*9,y:-Math.max(0,-c)*6};}
  else {ff={x:dir*5,y:0};bf={x:-dir*4,y:0};}
  const hipF={x:dir*4,y:-26}, hipB={x:-dir*3,y:-26};
  const shF={x:dir*6,y:-47}, shB={x:-dir*6,y:-47};
  // back arm and back leg sit behind the body
  const AL=17*(lk.armL||1);
  limb(shB.x,shB.y,other.x,other.y,AL,0,1,5.5,5,lk.skinDark);
  ctx.fillStyle=lk.skinDark; ctx.beginPath(); ctx.arc(other.x,other.y,3.4,0,Math.PI*2); ctx.fill();
  const legs=[[hipB,bf,lk.skinDark],[hipF,ff,lk.skin]];
  for(const [hp,ft,col] of legs){
    limb(hp.x,hp.y,ft.x,ft.y-4,13,dir,0,6.5,5.5,col);
    line(ft.x,ft.y-4,ft.x,ft.y-9,lk.sock,5);
    ctx.fillStyle=lk.sole; ctx.beginPath(); ctx.ellipse(ft.x+dir*3,ft.y-1,7,2.4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=lk.shoe; ctx.beginPath(); ctx.ellipse(ft.x+dir*2.5,ft.y-3.5,6.5,3.4,0,0,Math.PI*2); ctx.fill();
  }
  // shorts
  ctx.fillStyle=lk.shorts; ctx.beginPath();
  ctx.moveTo(-11,-33); ctx.lineTo(11,-33); ctx.lineTo(13,-19); ctx.lineTo(1.5,-19); ctx.lineTo(0,-23); ctx.lineTo(-1.5,-19); ctx.lineTo(-13,-19); ctx.closePath(); ctx.fill();
  ctx.fillStyle=lk.trim; ctx.fillRect(11.2,-31,1.6,11); ctx.fillRect(-12.8,-31,1.6,11);
  // neck
  ctx.fillStyle=lk.skin; ctx.fillRect(-3.5,-59,7,10);
  // tank-top jersey
  ctx.fillStyle=lk.jersey; ctx.beginPath();
  ctx.moveTo(-8,-51); ctx.lineTo(-4.5,-51); ctx.lineTo(0,-46); ctx.lineTo(4.5,-51); ctx.lineTo(8,-51);
  ctx.quadraticCurveTo(10,-44,12,-42); ctx.lineTo(11,-30); ctx.lineTo(-11,-30); ctx.lineTo(-12,-42);
  ctx.quadraticCurveTo(-10,-44,-8,-51); ctx.closePath(); ctx.fill();
  if(lk.stripes){ctx.save(); ctx.clip(); ctx.fillStyle="#22232B"; for(let x=-12;x<13;x+=6) ctx.fillRect(x,-52,3,23); ctx.restore();}
  ctx.strokeStyle=lk.trim; ctx.lineWidth=1.4; ctx.beginPath();
  ctx.moveTo(-4.5,-51); ctx.lineTo(0,-46); ctx.lineTo(4.5,-51);
  ctx.moveTo(8,-51); ctx.quadraticCurveTo(10,-44,12,-42); ctx.moveTo(-8,-51); ctx.quadraticCurveTo(-10,-44,-12,-42); ctx.stroke();
  ctx.font=DISP(lk.num.length>1?9:10); ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.lineWidth=2.5; ctx.strokeStyle=lk.trim===lk.numCol?lk.jersey:lk.trim; ctx.strokeText(lk.num,0,-37);
  ctx.fillStyle=lk.numCol; ctx.fillText(lk.num,0,-37);
  drawHead(lk,dir);
  // front arm on top
  limb(shF.x,shF.y,hand.x,hand.y,AL,0,1,6,5.2,lk.skin);
  ctx.fillStyle=lk.skin; ctx.beginPath(); ctx.arc(hand.x,hand.y,3.6,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
// Big cartoon head in a three-quarter view, facing the way the player plays.
function drawHead(lk,dir,mood){
  mood=mood||moodOf(lk);
  const hx=dir*1.5, hy=-67, R=12;
  // face
  ctx.fillStyle=lk.skin; ctx.beginPath(); ctx.ellipse(hx,hy,R,R*1.05,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=lk.skinDark; ctx.lineWidth=1; ctx.stroke();
  // ear on the back side of the head
  const ew=lk.bigEars?3.8:3.1, eh=lk.bigEars?5.2:4.4;
  ctx.fillStyle=lk.skin; ctx.beginPath(); ctx.ellipse(hx-dir*10,hy+1.5,ew,eh,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=lk.skinDark; ctx.stroke();
  ctx.fillStyle=lk.skinDark; ctx.beginPath(); ctx.ellipse(hx-dir*10,hy+1.5,ew*0.45,eh*0.5,0,0,Math.PI*2); ctx.fill();
  // hair
  ctx.fillStyle=lk.hair; ctx.beginPath();
  if(lk.style==="quiff"){
    ctx.moveTo(hx-dir*12.5,hy+2);
    ctx.quadraticCurveTo(hx-dir*14,hy-10,hx-dir*6,hy-16);
    ctx.quadraticCurveTo(hx+dir*2,hy-23,hx+dir*11,hy-18);
    ctx.quadraticCurveTo(hx+dir*14.5,hy-13.5,hx+dir*11.5,hy-8);
    ctx.quadraticCurveTo(hx+dir*5,hy-9.5,hx-dir*1,hy-8.5);
    ctx.quadraticCurveTo(hx-dir*7,hy-7.5,hx-dir*7.5,hy+1);
    ctx.closePath(); ctx.fill();
    // swept-back shine
    ctx.strokeStyle=lk.hairHi; ctx.lineWidth=1.2; ctx.beginPath();
    ctx.moveTo(hx+dir*9,hy-17); ctx.quadraticCurveTo(hx+dir*1,hy-19,hx-dir*8,hy-12);
    ctx.moveTo(hx+dir*10,hy-12.5); ctx.quadraticCurveTo(hx+dir*2,hy-14.5,hx-dir*9,hy-7);
    ctx.stroke();
  } else {
    ctx.moveTo(hx-dir*12.5,hy+2);
    ctx.quadraticCurveTo(hx-dir*14,hy-12,hx-dir*2,hy-14.5);
    ctx.quadraticCurveTo(hx+dir*10,hy-15,hx+dir*12.5,hy-6);
    ctx.lineTo(hx+dir*10,hy-5); ctx.lineTo(hx+dir*8,hy-7.5); ctx.lineTo(hx+dir*5,hy-5.5);
    ctx.lineTo(hx+dir*2,hy-7.5); ctx.lineTo(hx-dir*1,hy-5.5);
    ctx.quadraticCurveTo(hx-dir*7,hy-6,hx-dir*7.5,hy+1);
    ctx.closePath(); ctx.fill();
    // short spiky texture
    ctx.strokeStyle=lk.hairHi; ctx.lineWidth=1; ctx.beginPath();
    for(let i=0;i<4;i++){const x=hx+dir*(-6+i*4.5); ctx.moveTo(x,hy-12.5); ctx.lineTo(x+dir*2,hy-9);}
    ctx.stroke();
  }
  if(lk.band){   // a boss headband
    ctx.save(); ctx.beginPath(); ctx.ellipse(hx,hy,R+0.6,R*1.05+0.6,0,0,Math.PI*2); ctx.clip();
    ctx.fillStyle=lk.band; ctx.fillRect(hx-14,hy-10.5,28,3.6); ctx.restore();
  }
  // eyebrows: happy, shocked (raised) or grumpy (angled down)
  ctx.strokeStyle=lk.brow; ctx.lineWidth=1.6; ctx.lineCap="round"; ctx.beginPath();
  if(mood==="grump"){ctx.moveTo(hx+dir*1,hy-5.6); ctx.lineTo(hx+dir*4.8,hy-3.8); ctx.moveTo(hx+dir*7.2,hy-3.8); ctx.lineTo(hx+dir*10,hy-5.4);}
  else if(mood==="shock"){ctx.moveTo(hx+dir*1,hy-6); ctx.lineTo(hx+dir*4.8,hy-7); ctx.moveTo(hx+dir*7.2,hy-7); ctx.lineTo(hx+dir*10,hy-6);}
  else {ctx.moveTo(hx+dir*1,hy-4.5); ctx.lineTo(hx+dir*4.8,hy-5.2); ctx.moveTo(hx+dir*7.2,hy-5.2); ctx.lineTo(hx+dir*10,hy-4.4);}
  ctx.stroke();
  // eyes: near eye bigger than far eye
  const big=mood==="shock"?1.25:1;
  for(const [ex,s] of [[hx+dir*3,1],[hx+dir*8.6,0.85]]){
    ctx.fillStyle="#FFFFFF"; ctx.beginPath(); ctx.ellipse(ex,hy-1.5,2.5*s*big,(mood==="grump"?1.4:2)*s*big,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=lk.eye; ctx.beginPath(); ctx.arc(ex+dir*0.6,hy-1.4,1.45*s,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#141414"; ctx.beginPath(); ctx.arc(ex+dir*0.7,hy-1.4,0.7*s,0,Math.PI*2); ctx.fill();
  }
  // nose
  ctx.strokeStyle=lk.skinDark; ctx.lineWidth=1.2; ctx.beginPath();
  ctx.moveTo(hx+dir*6.6,hy); ctx.quadraticCurveTo(hx+dir*9.6,hy+3,hx+dir*7,hy+3.6); ctx.stroke();
  // rosy cheeks
  ctx.fillStyle="rgba(232,120,120,0.3)";
  ctx.beginPath(); ctx.arc(hx+dir*0.5,hy+3.5,2.6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(hx+dir*10,hy+3.5,1.8,0,Math.PI*2); ctx.fill();
  // mouth: big grin, shocked "O" or grumpy frown
  const mx=hx+dir*5.3, my=hy+5.4;
  if(mood==="shock"){
    ctx.fillStyle="#8E2A2A"; ctx.beginPath(); ctx.ellipse(mx,my+1.6,2.2,2.8,0,0,Math.PI*2); ctx.fill();
  } else if(mood==="grump"){
    ctx.strokeStyle="#8E2A2A"; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(mx-3.4,my+2.6); ctx.quadraticCurveTo(mx,my-0.4,mx+3.4,my+2.6); ctx.stroke();
  } else {
    ctx.fillStyle="#8E2A2A"; ctx.beginPath(); ctx.moveTo(mx-4.4,my); ctx.quadraticCurveTo(mx,my+6,mx+4.4,my); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#FFFFFF"; ctx.beginPath(); ctx.moveTo(mx-3.8,my+0.3); ctx.lineTo(mx+3.8,my+0.3); ctx.lineTo(mx+3.2,my+2); ctx.lineTo(mx-3.2,my+2); ctx.closePath(); ctx.fill();
    if(lk.gapTeeth){ctx.fillStyle="#8E2A2A"; ctx.fillRect(mx-0.4,my+0.3,0.9,1.8);}
    ctx.strokeStyle="#B4534E"; ctx.lineWidth=0.9; ctx.beginPath(); ctx.moveTo(mx-4.4,my); ctx.quadraticCurveTo(mx,my+6,mx+4.4,my); ctx.stroke();
  }
}

function drawPlayer(){

  else if(dunk.on && dunk.wind && !dunk.resolved){hx=ball.x-p.x; hy=ball.y-p.y; ox=-14; oy=-64;}
  else if(dunk.on){
    if(dunk.t<RISE){hx=10;hy=-96;ox=-16;oy=-66;}
    else if(dunk.t<RISE+SLAM+dunk.hang || !dunk.resolved){hx=12;hy=-86;ox=-14;oy=-64;}

  }

  }

  return BALLS;
}
// ball 0 is the classic one; ball n belongs to arena n, which opens when that boy reaches level n
function ballUnlocked(boy,i){return i===0 || Math.floor(progress[boy]/STOPS)>=i-1 || extraBalls[boy].includes(i);}
function unlockedBalls(boy){return ballList().map((_,i)=>i).filter(i=>ballUnlocked(boy,i));}
function ballOf(boy){const i=kits[boy].ball||0; return ballList()[ballUnlocked(boy,i)?i:0];}
function drawBallAt(x,y,R,def,rot){
  ctx.save(); ctx.translate(x,y);
  const shade=(c,k)=>[mix(c,"#FFFFFF",0.38),c,mix(c,"#000000",0.35)];
  const ga=shade(def.a), g=ctx.createRadialGradient(-R*0.38,-R*0.44,R*0.06,0,0,R);   // light from the top left
  g.addColorStop(0,ga[0]); g.addColorStop(0.5,ga[1]); g.addColorStop(1,ga[2]);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.clip();
  ctx.rotate(rot);
  if(def.b){   // two-tone: the second colour fills alternate panels, so it flashes as the ball spins
    const gb=shade(def.b), g2=ctx.createRadialGradient(-R*0.38,-R*0.44,R*0.06,0,0,R);
    g2.addColorStop(0,gb[0]); g2.addColorStop(0.5,gb[1]); g2.addColorStop(1,gb[2]); ctx.fillStyle=g2;
    ctx.beginPath(); ctx.moveTo(0,-R); ctx.lineTo(0,0); ctx.lineTo(R,0); ctx.arc(0,0,R,0,-Math.PI/2,true); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0,R); ctx.lineTo(0,0); ctx.lineTo(-R,0); ctx.arc(0,0,R,Math.PI,Math.PI/2,true); ctx.fill();
  }
  ctx.fillStyle="rgba(40,15,0,0.2)";
  for(const [px,py] of PEBBLES){const k=R/8; ctx.fillRect(px*k-0.35,py*k-0.35,0.7,0.7);}
  // the eight-panel seam pattern: a cross plus two curved side seams
  ctx.strokeStyle=def.b?"rgba(15,15,25,0.9)":"#2A1206"; ctx.lineWidth=Math.max(1.05,R*0.13); ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(-R,0); ctx.lineTo(R,0);
  ctx.moveTo(0,-R); ctx.lineTo(0,R);
  ctx.moveTo(-R*0.62,-R*0.82); ctx.quadraticCurveTo(-R*0.18,0,-R*0.62,R*0.82);
  ctx.moveTo(R*0.62,-R*0.82); ctx.quadraticCurveTo(R*0.18,0,R*0.62,R*0.82);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle="rgba(255,255,255,0.35)"; ctx.beginPath(); ctx.ellipse(-R*0.38,-R*0.45,R*0.3,R*0.18,-0.6,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=mix(def.a,"#000000",0.55); ctx.lineWidth=Math.max(1,R*0.12); ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}
// dribbling: the ball bounces between the hand and the floor beside the player
function dribblePos(e,dir,dt){
  const before=Math.floor((e.drib||0)/Math.PI+0.5);
  e.drib=(e.drib||0)+dt*(7+Math.min(6,Math.abs(e.spd||0)*0.03));
  if(Math.floor(e.drib/Math.PI+0.5)!==before) play("dribble");
  const u=Math.abs(Math.cos(e.drib)), top=e.y-42, low=FLOOR-8;
  return {x:e.x+dir*15, y:low+(top-low)*u};
}

    const u=1-fx.t/0.45;
    ctx.globalAlpha=1-u; ctx.strokeStyle=C.green; ctx.lineWidth=3;
    for(const k of [1,0.6]){ctx.beginPath(); ctx.ellipse(fx.x,fx.y,(10+u*34)*k,(3+u*9)*k,0,0,Math.PI*2); ctx.stroke();}
    ctx.globalAlpha=1;

    ctx.strokeStyle="rgba(255,255,255,0.5)"; ctx.lineWidth=2;
    for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(p.x-22-i*6,p.y-20-i*14);ctx.lineTo(p.x-40-i*6,p.y+4-i*14);ctx.stroke();}

function draw(){
  ctx.save();
  if(screen==="title") drawTitle();
  else if(screen==="setup") drawSetup();
  else if(screen==="players") drawPlayers();
  else if(screen==="trophies") drawTrophies();
  else {
    drawGame();
    if(screen==="pause") drawPause();
    else if(screen==="over") drawOver();
  }
  ctx.restore();
}

const roles=new Map();
function toLocal(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener("pointerdown",e=>{
  audioInit();
  const q=toLocal(e); let role=null;
  if(screen!=="play"){
    for(let i=ui.length-1;i>=0;i--){const u=ui[i];
      if(q.x>=u.x&&q.x<=u.x+u.w&&q.y>=u.y&&q.y<=u.y+u.h){play("click"); u.fn(); e.preventDefault(); return;}}
    if(screen==="title" && inMap(q)){
      mapDrag={id:e.pointerId,y0:q.y,s0:mapScroll,moved:false};
      try{cv.setPointerCapture(e.pointerId);}catch(_){}
    }
    e.preventDefault(); return;
  }
  if(q.x>=PAUSE_BTN.x-6&&q.x<=PAUSE_BTN.x+PAUSE_BTN.w+6&&q.y>=PAUSE_BTN.y-6&&q.y<=PAUSE_BTN.y+PAUSE_BTN.h+6){
    screen="pause"; touchJoy=0; shootTouch=false; roles.clear(); e.preventDefault(); return;
  }
  if(q.x>=SOUND_BTN.x-6&&q.x<=SOUND_BTN.x+SOUND_BTN.w+6&&q.y>=SOUND_BTN.y-4&&q.y<=SOUND_BTN.y+SOUND_BTN.h+6){
    toggleSound(); e.preventDefault(); return;
  }
  if(Math.hypot(q.x-SHOOT.x,q.y-SHOOT.y)<SHOOT.r+18){role="shoot";shootTouch=true;}
  else if(Math.hypot(q.x-JUMP.x,q.y-JUMP.y)<JUMP.r+12){role="jump";jumpQueued=true;}
  else if(q.x<HALF && q.y>200){role="joy";touchJoy=clamp((q.x-JOY.x)/40,-1,1);touchJoyY=clamp((q.y-JOY.y)/40,-1,1);}
  if(role){roles.set(e.pointerId,role);try{cv.setPointerCapture(e.pointerId);}catch(_){}}
  e.preventDefault();
});
cv.addEventListener("pointermove",e=>{
  if(mapDrag && mapDrag.id===e.pointerId){const q=toLocal(e); if(Math.abs(q.y-mapDrag.y0)>7) mapDrag.moved=true;
    mapScroll=clamp(mapDrag.s0-(q.y-mapDrag.y0),0,mapMaxScroll()); return;}
  if(roles.get(e.pointerId)==="joy"){const q=toLocal(e);touchJoy=clamp((q.x-JOY.x)/40,-1,1);touchJoyY=clamp((q.y-JOY.y)/40,-1,1);}
});
cv.addEventListener("wheel",e=>{
  if(screen!=="title") return;
  scrollMap(e.deltaY*0.6); e.preventDefault();
},{passive:false});
function endPointer(e){
  if(mapDrag && mapDrag.id===e.pointerId){ if(!mapDrag.moved && e.type==="pointerup") tapMap(toLocal(e)); mapDrag=null; }
  const role=roles.get(e.pointerId);
  if(role==="joy"){touchJoy=0; touchJoyY=0;}
  if(role==="shoot") shootTouch=false;
  roles.delete(e.pointerId);
}
cv.addEventListener("pointerup",endPointer); cv.addEventListener("pointercancel",endPointer);
cv.addEventListener("contextmenu",e=>e.preventDefault());
function keyJoyUpdate(){keyJoy=((keys.has("ArrowRight")||keys.has("d"))?1:0)-((keys.has("ArrowLeft")||keys.has("a"))?1:0);
  keyJoyY=(keys.has("ArrowDown")||keys.has("s"))?1:0;}
cv.addEventListener("keydown",e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," ","a","d","w","s","k"].includes(k)) e.preventDefault();
  if(e.repeat) return;
  if(screen==="title" && (k==="ArrowUp"||k==="ArrowDown")){ scrollMap(k==="ArrowUp"?-60:60); return; }
  if(k==="m"||k==="M"){ toggleSound(); return; }
  if(k==="Escape"||k==="p"){ if(screen==="play") screen="pause"; else if(screen==="pause") screen="play"; return; }
  if(k==="Enter"){
    if(screen==="title") openNextLevel(); else if(screen==="setup") tryStart();
    else if(screen==="over") startGame(); else if(screen==="pause") screen="play";
    return;
  }
  audioInit(); keys.add(k); keyJoyUpdate();
  if(k==="ArrowUp"||k==="w") jumpQueued=true;
  if(k===" "||k==="k") shootKey=true;
});
cv.addEventListener("keyup",e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  keys.delete(k); keyJoyUpdate();
  if(k===" "||k==="k") shootKey=false;
});
cv.addEventListener("blur",()=>{keys.clear();keyJoy=0;keyJoyY=0;shootKey=false;});

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000); last=now;
  update(dt); draw(); requestAnimationFrame(frame);
}
loadSave(); applyLooks(); fit(); inbound("p"); screen="title";
requestAnimationFrame(frame);
try{cv.focus({preventScroll:true});}catch(_){}
})();
</script>

// install support: register the offline worker
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
