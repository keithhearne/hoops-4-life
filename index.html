<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hoops 4 Life</title>
<meta name="theme-color" content="#10152B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{overscroll-behavior:none;touch-action:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;900&display=swap">
<style>
/* One-screen arcade court: canvas scaled to fit, controls drawn in-game. Single dark arena look. */
:root{
  --arena:#10152B; --court:#1B2340; --ink:#FFFFFF; --muted:#C9D1EE; --accent:#FFC93C;
  --display:"Bungee", "Arial Black", Impact, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--arena); color:var(--ink); font-family:var(--body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0; box-sizing:border-box; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;border-radius:10px;background:var(--court)}
canvas:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#rotate{
  position:fixed; inset:0; background:var(--arena); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:14px; text-align:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
}
#rotate[hidden]{display:none}
#rotate h1{font-family:var(--display);font-size:28px;margin:0;color:var(--accent);text-wrap:balance}
#rotate p{margin:0;color:var(--muted);font-weight:700;max-width:30ch}
#rotate button{
  font:900 16px var(--body); color:var(--court); background:var(--accent); border:0;
  border-radius:14px; padding:12px 22px; cursor:pointer;
}
#rotate button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>

<div id="wrap"><canvas id="game" tabindex="0" aria-label="Hoops 4 Life basketball game. Use the joystick to move, Jump to jump or block, and hold Shoot to power up a shot."></canvas></div>
<div id="rotate" hidden>
  <h1>Turn your phone sideways</h1>
  <p>Hoops 4 Life is played in landscape so both hoops fit on screen.</p>
  <button id="rotateOk" type="button">Play anyway</button>
</div>

function fit(){

// who is defending, and is their arm up

// Defending: face the ball handler, so from behind you turn and chase him, and once past him you face him.
// With the ball: face the way you're going (always towards the hoop when shooting or dunking).
// Loose ball: face the ball.

  const pDef = owner===d || (ball.state==="flight" && ball.shooter===d);
  if(dunk.on || charge.on) p.face=1;
  else if(tip.on) p.face=Math.sign(d.x-p.x)||1;
  else if(owner===p) p.face = joy<-0.3?-1:(joy>0.3?1:p.face);
  else if(cpuOn && pDef) p.face=Math.sign(d.x-p.x)||p.face;
  else if(Math.abs(joy)>0.3) p.face=Math.sign(joy);
  else if(ball.state==="free" && Math.abs(ball.x-p.x)>6) p.face=Math.sign(ball.x-p.x);
  if(!cpuOn) return;
  const dDef = owner===p || (ball.state==="flight" && ball.shooter===p);
  if(cdunk.on || cpu.charging) d.face=-1;
  else if(tip.on) d.face=Math.sign(p.x-d.x)||-1;
  else if(owner===d) d.face = Math.abs((d.spd||0))>15 ? Math.sign(d.spd) : -1;
  else if(dDef) d.face=Math.sign(p.x-d.x)||d.face;

  p.x=TIP_X-26; d.x=TIP_X+26; d.jumped=false; msg.t=0;
  // when the computer jumps after the drop: the perfect moment, plus a random error that gets smaller on later levels
  const ideal=0.1;

    if(tip.t>=tip.beeps && tip.beeps<TIP_COUNT){tip.beeps++; play("beep");}
    if(tip.t>=TIP_COUNT){tip.tossed=true; tip.tt=0; ball.vy=0; ball.y=TIP_Y; play("whistle");}

  tip.tt+=dt;

  const pt=ph && Math.hypot(ball.x-ph.x,ball.y-ph.y)<22, ct=ch && Math.hypot(ball.x-ch.x,ball.y-ch.y)<22;
  if(pt||ct){

  ctx.lineWidth=8; ctx.lineJoin="round"; ctx.strokeStyle=C.navy; ctx.strokeText(String(n),TIP_X,TIP_Y+70);
  ctx.fillStyle=C.warn; ctx.fillText(String(n),TIP_X,TIP_Y+70);

function startCrackFx(){
  const cx=W/2+(Math.random()-0.5)*60, cy=H/2-20+(Math.random()-0.5)*30, n=16, lines=[], rings=[], branches=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(Math.random()-0.5)*0.35, len=560+Math.random()*200;
    lines.push(withLengths(jagged(cx,cy,cx+Math.cos(a)*len,cy+Math.sin(a)*len,16,20)));}
  for(const r of [16,38,74,130,210,300]){const ring=[];
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(Math.random()-0.5)*0.2, r2=r*(0.8+Math.random()*0.4); ring.push([cx+Math.cos(a)*r2,cy+Math.sin(a)*r2]);}
    rings.push({r,ring});}
  for(let k=0;k<34;k++){   // side cracks that appear when the whole screen goes
    const l=lines[Math.floor(Math.random()*n)], j=4+Math.floor(Math.random()*(l.pts.length-5)), [x0,y0]=l.pts[j];
    const base=Math.atan2(y0-cy,x0-cx), a=base+(Math.random()<0.5?-1:1)*(0.5+Math.random()*0.7), len=50+Math.random()*170;
    branches.push(jagged(x0,y0,x0+Math.cos(a)*len,y0+Math.sin(a)*len,6,14));}
  crackFx={t:CRACK_T,T:CRACK_T,lines,rings,branches,cx,cy,shook:false};
  play("crack");
}
function crackReach(e){   // how far from the middle the cracks have spread, e seconds after the smash
  if(e<CRACK_SMASH) return 22*Math.min(1,e/0.1);
  if(e<CRACK_ALL) return 22+(260-22)*Math.pow((e-CRACK_SMASH)/(CRACK_ALL-CRACK_SMASH),2.6);   // slow, then faster
  return Infinity;
}
function updateFx(dt){
  if(boardFx.t>0){
    boardFx.t-=dt; if(boardFx.flash>0) boardFx.flash-=dt;
    if(boardFx.boltT>0){boardFx.boltT-=dt; if(Math.random()<0.35) boardFx.bolts=makeBolts(boardFx.side);}   // the bolt flickers
    for(const s of boardFx.shards){
      s.vy+=GB*dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.rot+=s.vr*dt;
      if(s.y>FLOOR-2){s.y=FLOOR-2; s.vy*=-0.25; s.vx*=0.6; s.vr*=0.5;}
    }
  }
  if(crackFx.t>0){
    crackFx.t-=dt;
    if(!crackFx.shook && crackFx.T-crackFx.t>=CRACK_ALL){crackFx.shook=true; shakeT=Math.max(shakeT,0.3); SND.last.glass=0; play("glass",true);}
  }

}
function boardGone(side){return boardFx.t>0.5 && boardFx.shatter && boardFx.side===side;}
function drawBoardFx(){
  if(boardFx.t<=0) return;
  if(boardFx.boltT>0){
    for(const b of boardFx.bolts) for(const [w,col] of [[10,"rgba(140,180,255,0.35)"],[3.5,"rgba(220,235,255,0.95)"],[1.5,"#FFFFFF"]]){
      ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineJoin="round"; ctx.lineCap="round";
      ctx.beginPath(); b.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke();
    }
    const bx=boardFx.side==="R"?780:63, g=ctx.createRadialGradient(bx,170,2,bx,170,80);
    g.addColorStop(0,"rgba(255,255,255,0.85)"); g.addColorStop(1,"rgba(160,200,255,0)");
    ctx.fillStyle=g; ctx.fillRect(bx-80,90,160,160);
  }
  ctx.globalAlpha=Math.min(1,boardFx.t/0.5);
  for(const s of boardFx.shards){
    ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.rot);
    ctx.fillStyle="rgba(205,235,255,0.85)"; ctx.beginPath(); ctx.moveTo(-s.s,-s.s*0.6); ctx.lineTo(s.s,-s.s*0.2); ctx.lineTo(-s.s*0.2,s.s); ctx.closePath(); ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,0.9)"; ctx.lineWidth=0.8; ctx.stroke(); ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawScreenFx(){
  if(boardFx.t>0 && boardFx.flash>0){ctx.fillStyle="rgba(255,255,255,"+(Math.min(1,boardFx.flash/0.32)*0.7).toFixed(3)+")"; ctx.fillRect(0,0,W,H);}
  if(crackFx.t<=0) return;
  const e=crackFx.T-crackFx.t, reach=crackReach(e), all=e>=CRACK_ALL;
  ctx.save(); ctx.globalAlpha=e>1.6?Math.max(0,(CRACK_T-e)/0.4):1; ctx.lineJoin="round"; ctx.lineCap="round";
  const partial=l=>{ctx.beginPath(); ctx.moveTo(l.pts[0][0],l.pts[0][1]);
    for(let i=1;i<l.pts.length;i++){
      if(l.cum[i]<=reach){ctx.lineTo(l.pts[i][0],l.pts[i][1]); continue;}
      const u=(reach-l.cum[i-1])/(l.cum[i]-l.cum[i-1]); ctx.lineTo(l.pts[i-1][0]+(l.pts[i][0]-l.pts[i-1][0])*u, l.pts[i-1][1]+(l.pts[i][1]-l.pts[i-1][1])*u); break;}
    ctx.stroke();};
  for(const [w,col] of [[3.2,"rgba(0,0,0,0.38)"],[1.5,"rgba(255,255,255,0.95)"]]){
    ctx.strokeStyle=col; ctx.lineWidth=w;
    for(const l of crackFx.lines) partial(l);
    for(const {r,ring} of crackFx.rings) if(reach>=r*1.15){ctx.beginPath(); ring.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath(); ctx.stroke();}
    if(all) for(const b of crackFx.branches){ctx.beginPath(); b.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke();}
  }
  // the smash point glints, and the screen flashes as it all goes
  const glow=Math.min(60,18+reach*0.25), g=ctx.createRadialGradient(crackFx.cx,crackFx.cy,0,crackFx.cx,crackFx.cy,glow);
  g.addColorStop(0,"rgba(255,255,255,0.8)"); g.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(crackFx.cx,crackFx.cy,glow,0,Math.PI*2); ctx.fill();
  if(all && e<CRACK_ALL+0.15){ctx.fillStyle="rgba(255,255,255,"+(0.45*(1-(e-CRACK_ALL)/0.15)).toFixed(3)+")"; ctx.fillRect(0,0,W,H);}
  ctx.restore();
}
// where the hand (and ball) is during a windmill: from overhead, 180 degrees round behind the back to down low,
// then forward and up over the top into the rim
function windmillHand(dk,e,dir,rim){
  const sx=e.x+dir*6, sy=e.y-47, L=34;
  if(dk.t<RISE){
    // under and over: the ball drops down by the hip, then swings back behind and up over the top
    const u=Math.min(1,Math.max(0,(dk.t-dk.w0)/Math.max(0.08,RISE-dk.w0)));
    const down={x:sx, y:sy+L};
    if(u<0.22){const k=u/0.22, from={x:e.x+dir*10,y:e.y-96}; return {x:from.x+(down.x-from.x)*k, y:from.y+(down.y-from.y)*k};}
    const th=Math.PI/2+Math.PI*((u-0.22)/0.78);   // down -> behind -> straight up
    return {x:sx+dir*Math.cos(th)*L, y:sy+Math.sin(th)*L};
  }
  const u=Math.min(1,(dk.t-RISE)/SLAM), th=-Math.PI/2+Math.PI*0.45*u, k=u*u;   // from up, forward and down into the rim
  const arm={x:sx+dir*Math.cos(th)*L, y:sy+Math.sin(th)*L};
  return {x:arm.x+(rim.x-arm.x)*k, y:arm.y+(rim.y-6-arm.y)*k};
}

// ---------- stealing ----------
function trySteal(joy,joyY){
  if(stealCool>0) return;
  const toward=Math.sign(d.x-p.x)||1;
  const diagonal = joyY>0.45 && joy*toward>0.3;   // down and towards the ball handler
  stealSwipe=0.3; stealCool=STEAL_COOLDOWN;
  if(!diagonal){stealMsg={text:"Pull the joystick down towards him!",t:1.2}; return;}
  if(Math.abs(d.x-p.x)>STEAL_REACH){stealMsg={text:"Too far away!",t:1}; return;}
  // he can only lose it while dribbling, not once the ball is up for a shot
  const chance = (cpu.charging||!d.ground) ? 0 : SKILL.stealChance;
  if(Math.random()<chance){
    play("swipe"); play("squeak"); play("cheer",0.8);
    stats.stl++; owner=p; ball.state="held"; ball.live=false; needRelease=true;
    cpu.charging=false; charge.on=false;
    say(pick("steal"),"You stole it from "+NAME.d+"!",C.info);
    setMood(p,"happy"); setMood(d,"shock"); celebrateFor(p);
    lastShot="Steal by "+NAME.p;
  } else {
    play("swipe"); stealMsg={text:pick("stealMiss"),t:1};
  }
}

// ---------- player shooting ----------
function startCharge(){
  charge.on=true; charge.power=0; charge.holdT=0; charge.zone=zoneFor(p.x,RR);
  d.jumped=false;
  // The defender doesn't read your power bar: sometimes he doesn't react at all,
  // otherwise he guesses a moment to jump somewhere in the hold.
  // He guesses roughly when you'll let go (from the middle of the sweet spot), with random error.
  const z=charge.zone, est=(z.n[0]+z.n[1])/200*(z.fill||FILL);
  d.react = Math.random()<SKILL.noReact ? null : Math.max(0.2, est-0.2+(Math.random()*2-1)*SKILL.timingNoise);
}
function release(auto){
  const z=zoneFor(p.x,RR), range=charge.fade?z.f:z.n, pw=charge.power;
  const h=handPos(p,1,true);
  const make=!auto && !z.behind && pw>=range[0] && pw<=range[1];
  const tx=z.behind?RR.x:targetFor(pw,range,auto), sp=shotPath(h.x,h.y,tx,RR.y);   // from behind it flies at the hoop and hits the back of the board
  const missType=z.behind?"behind":(auto?"auto":(pw<range[0]?(pw<range[0]-25?"air":"short"):"long"));
  Object.assign(ball,{state:"flight",x0:h.x,y0:h.y,x:h.x,y:h.y,vx:sp.vx,vy:sp.vy,T:sp.T,t:0,make,pts:z.pts,timer:0,
    shooter:p,missType,dunk:false,wind:false,lucky:false,live:false,saveTried:false,fade:charge.fade,far:z===ZONES.far});
  owner=null; stats.att++;
  charge.lastPower=pw; charge.shown=1.2; charge.range=range; charge.zone=z;
  lastShot = z.behind ? "No shot from behind the basket: get in front of it" : auto ? "Held too long: the ball flew off at 100"
    : "Let go at "+Math.round(pw)+" · needed "+range[0]+"–"+range[1]+(charge.fade?" (fade-away)":"");
  charge.on=false;
}
// ---------- computer shooting ----------
function cpuRelease(){
  const z=zoneFor(d.x,RL), h=handPos(d,-1,true);
  const chance=Math.min(0.95,z.cpu*SKILL.acc*(cpu.fade?0.85:1)), make=Math.random()<chance;
  const s=Math.random()<0.5?-1:1, tx=make?RL.x:(s>0?RL.x+20+Math.random()*16:RL.x-Math.min(15,11.8+Math.random()*2.6));   // front of the rim, or back of the rim
  const sp=shotPath(h.x,h.y,tx,RL.y);
  const over=(tx-RL.x)*RL.dir>0;
  Object.assign(ball,{state:"flight",x0:h.x,y0:h.y,x:h.x,y:h.y,vx:sp.vx,vy:sp.vy,T:sp.T,t:0,make,pts:z.pts,timer:0,
    shooter:d,missType:over?"long":"short",dunk:false,wind:false,lucky:false,live:false,fade:cpu.fade,far:z===ZONES.far});
  owner=null; cpu.charging=false;
  lastShot=NAME.d+" shot from "+z.name.toLowerCase()+(cpu.fade?" with a fade-away":"");
}

// ---------- ball physics: rims, backboards and floor ----------
// How much speed the ball keeps when it bounces (coefficient of restitution), based on real basketball
// measurements: a steel rim gives back about 55%, the glass backboard about 75%, a hardwood floor about 78%.
const BOUNCE={rim:0.55, board:0.75, floor:0.78, net:0.15}, RIM_GRIP=0.88, BALL_R=8, RIM_Y=186;
const HOOPS=[   // each hoop: the front and back edge of the rim, and the face of the backboard
  {rim:RR, net:1, edges:[[737,RIM_Y],[775,RIM_Y]], face:777, faceDir:-1, top:140, bot:202},
  {rim:RL, net:0, edges:[[107,RIM_Y],[69,RIM_Y]],  face:67,  faceDir:1,  top:140, bot:202}
];
// bounce the ball off a small round point (a rim edge or a backboard corner)
function hitPoint(px,py,r,e){
  const dx=ball.x-px, dy=ball.y-py, dd=Math.hypot(dx,dy), min=BALL_R+r;
  if(dd>=min||dd<0.001) return false;
  const nx=dx/dd, ny=dy/dd; ball.x=px+nx*min; ball.y=py+ny*min;
  const vn=ball.vx*nx+ball.vy*ny; if(vn>=0) return false;
  // reverse the part of the speed going into the rim (losing some), keep most of the part along it
  const tx=ball.vx-vn*nx, ty=ball.vy-vn*ny;
  ball.vx=-e*vn*nx+tx*RIM_GRIP; ball.vy=-e*vn*ny+ty*RIM_GRIP;
  if(Math.hypot(ball.vx,ball.vy)<70) ball.vx+=(ball.x<px?-1:1)*45;   // a ball never balances on the rim
  return true;
}
function collideHoops(){
  let hit=null;
  for(const h of HOOPS){
    for(const [px,py] of h.edges) if(hitPoint(px,py,2.5,BOUNCE.rim)){hit="rim"; netKick(h.net,1.5,0); play("rim",Math.hypot(ball.vx,ball.vy)/BOUNCE.rim);}
    if(ball.y>h.top && ball.y<h.bot){   // the glass
      const back=h.face-h.faceDir*7;   // the back of the board
      if(h.faceDir<0 && ball.x-BALL_R<back && ball.x>h.face+3 && ball.vx<0){ball.x=back+BALL_R; ball.vx=-ball.vx*BOUNCE.board; hit=hit||"board"; play("board",Math.abs(ball.vx)/BOUNCE.board);}
      if(h.faceDir>0 && ball.x+BALL_R>back && ball.x<h.face-3 && ball.vx>0){ball.x=back-BALL_R; ball.vx=-ball.vx*BOUNCE.board; hit=hit||"board"; play("board",Math.abs(ball.vx)/BOUNCE.board);}
      if(h.faceDir<0 && ball.x+BALL_R>h.face && ball.x<h.face+7 && ball.vx>0){ball.x=h.face-BALL_R; ball.vx=-ball.vx*BOUNCE.board; ball.vy*=0.92; hit=hit||"board"; play("board",Math.abs(ball.vx)/BOUNCE.board);}
      if(h.faceDir>0 && ball.x-BALL_R<h.face && ball.x>h.face-7 && ball.vx<0){ball.x=h.face+BALL_R; ball.vx=-ball.vx*BOUNCE.board; ball.vy*=0.92; hit=hit||"board"; play("board",Math.abs(ball.vx)/BOUNCE.board);}
    }
    for(const cy of [h.top,h.bot]) if(hitPoint(h.face-h.faceDir*3.5,cy,3.5,BOUNCE.board)) hit=hit||"board";
    const fx=h.edges[0][0];   // the net hangs from the front of the rim, slanting in, and soaks up most of the speed
    for(const [dx,dy] of [[2,10],[4,20],[6,28]]) if(hitPoint(fx-h.faceDir*dx,RIM_Y+dy,2,BOUNCE.net)){hit=hit||"net"; netKick(h.net,1,0);}
  }
  return hit;
}
function floorAndWalls(){
  if(ball.y>FLOOR-BALL_R){
    ball.y=FLOOR-BALL_R;
    if(ball.vy>0){play("bounce",ball.vy); ball.vy=-ball.vy*BOUNCE.floor; ball.vx*=0.9;}
    if(Math.abs(ball.vy)<35) ball.vy=0;
  }
  if(ball.x<8){ball.x=8; ball.vx=Math.abs(ball.vx)*0.6;}
  if(ball.x>836){ball.x=836; ball.vx=-Math.abs(ball.vx)*0.6;}
}
// after a miss, a ball that bounces around and drops through its own hoop still counts
function checkRollIn(prevY){
  if(ball.missType==="behind") return;   // a shot from behind can't sneak in
  const h=ball.shooter===p?HOOPS[0]:HOOPS[1], a=Math.min(h.edges[0][0],h.edges[1][0]), b=Math.max(h.edges[0][0],h.edges[1][0]);
  if(ball.vy>0 && prevY<RIM_Y && ball.y>=RIM_Y && ball.x>a+5 && ball.x<b-5){
    ball.make=true; ball.lucky=true; ball.live=false; arrive(0);
  }
}

// ---------- update ----------
function update(dt){
  if(screen!=="play"){updateNets(dt); return;}
  if(gameOverT>0){gameOverT-=dt; if(gameOverT<=0){endGame(); return;}}
  if(pendingInbound){inboundT-=dt; if(inboundT<=0){const w=pendingInbound;pendingInbound=null; if(gameOverT<=0) inbound(w);}}
  const joy=clamp(touchJoy||keyJoy,-1,1), joyY=clamp(touchJoyY||keyJoyY,-1,1);
  const shootDown=shootKey||shootTouch;
  // STEAL: on defence, close to the ball handler, joystick pulled down and towards him, then press STEAL
  if(stealCool>0) stealCool-=dt;
  if(stealSwipe>0) stealSwipe-=dt;
  if(stealMsg.t>0) stealMsg.t-=dt;
  const pressed=shootDown && !prevAction; prevAction=shootDown;
  if(pressed && cpuOn && owner===d && ball.state==="held" && !cdunk.on) trySteal(joy,joyY);

  // player
  if(!shootDown) needRelease=false;
  if(dunk.on && !dunk.wind && !dunk.resolved && dunk.t<RISE*0.8 && joyY<-0.5){
    dunk.wind=true; dunk.w0=dunk.t; dunk.success=Math.random()<WIND_MAKE; lastShot="WINDMILL! · 40% chance";
  }
  if(dunk.on) updateDunk(dt);
  else {
    if(!tip.on) p.x=clamp(p.x+joy*(charge.on?70:170)*dt,24,812);
    if(jumpQueued && p.ground){p.vy=-380;p.ground=false;p.dbl=false; play("squeak");}
    else if(jumpQueued && !p.ground && !p.dbl && playerDefending()){
      // double jump: only works if the second tap lands near the top of the first jump
      if(apexWindow()){p.vy=-380; p.dbl=true; dblFx={t:0.45,x:p.x,y:p.y};}
      else {p.dbl=true; dblMiss=0.6;}
    }
    // jump shot hang time: while powering up in the air the player freezes, and drops after the release
    if(charge.on && !p.ground){   // jump shot: keep rising normally, then float down slowly while the bar fills
      p.vy = p.vy<0 ? p.vy+G*dt : Math.min(p.vy+G*0.15*dt, 55);
      p.y+=p.vy*dt; if(p.y>=FLOOR){p.y=FLOOR; p.vy=0; p.ground=true;}
    }
    else body(p,dt);
  }
  jumpQueued=false;
  if(shakeT>0) shakeT-=dt;

  if(owner===p && ball.state==="held" && !dunk.on){
    if(shootDown && !charge.on && !needRelease && p.ground && inKey(p.x)) startDunk();
    else if(shootDown && !charge.on && !needRelease) startCharge();
    if(charge.on){
      const before=charge.power; charge.power+=dt/(zoneFor(p.x,RR).fill||FILL)*100; charge.holdT+=dt;
      {const z=zoneFor(p.x,RR), lo=(charge.fade?z.f:z.n)[0]; if(before<lo && charge.power>=lo) play("tick");}
      charge.fade=joy<-0.35; charge.zone=zoneFor(p.x,RR);
      if(!shootDown) release(false);
      else if(charge.power>=100){charge.power=100;release(true);}
    }
  } else if(charge.on && owner!==p){charge.on=false;}
  p.lean+=(((charge.on&&charge.fade)?-0.25:0)-p.lean)*Math.min(1,dt*12);
  if(charge.shown>0) charge.shown-=dt;

  // computer
  if(cpuOn) cpuUpdate(dt);
  updateFacing(joy);

  // ball
  if(ball.state==="held"){
    let h;
    if(owner===p && dunk.on && dunk.wind) h=windmillHand(dunk,p,1,RR);
    else if(owner===d && cdunk.on && cdunk.wind) h=windmillHand(cdunk,d,-1,RL);
    else if(owner===p && dunk.on){
      const a={x:p.x+10,y:p.y-96};
      if(dunk.t<RISE) h=a;
      else {const u=Math.min(1,(dunk.t-RISE)/SLAM); h={x:a.x+(RR.x-a.x)*u, y:a.y+(RR.y-6-a.y)*u};}
    } else if(owner===d && cdunk.on){
      const a={x:d.x-10,y:d.y-96};
      if(cdunk.t<RISE) h=a;
      else {const u=Math.min(1,(cdunk.t-RISE)/SLAM); h={x:a.x+(RL.x-a.x)*u, y:a.y+(RL.y-6-a.y)*u};}
    } else {
      const e=owner, charging=e===d?cpu.charging:charge.on, dir=charging?(e===d?-1:1):(e.face||(e===d?-1:1));
      h = (!charging && e.ground) ? dribblePos(e,dir,dt) : handPos(e,dir,charging);
    }
    ball.x=h.x; ball.y=h.y; ball.rot=(ball.rot||0)+dt*2.5;
  } else if(ball.state==="flight"){
    ball.rot=(ball.rot||0)-Math.sign(ball.vx||1)*9*dt; // backspin
  }
  if(ball.state==="free"){ ball.rot=(ball.rot||0)+(ball.vx||0)*dt/8; }
  else if(ball.state==="made"){ ball.rot=(ball.rot||0)+dt*2; }
  if(ball.state==="held"){
  } else if(ball.state==="flight"){
    ball.t+=dt; const t=ball.t;
    let hit=null;
    if(ball.make){ ball.x=ball.x0+ball.vx*t; ball.y=ball.y0+ball.vy*t+0.5*GB*t*t; }
    else {   // small steps so the ball can't skip through the rim
      const n=4, h=dt/n;
      for(let k=0;k<n && !hit;k++){ ball.vy+=GB*h; ball.x+=ball.vx*h; ball.y+=ball.vy*h; hit=collideHoops(); }
    }
    const early=t<ball.T*0.55;
    // the save: the ball is coming down close to the hoop, and a defender's hand gets to it above the rim
    const rimX=ball.shooter===p?RR.x:RL.x, vyNow=ball.make?ball.vy+GB*t:ball.vy;
    const saveZone=vyNow>0 && Math.abs(ball.x-rimX)<95 && ball.y<RIM_Y+2;
    if((early||saveZone) && ball.shooter===p && cpuArmUp()){
      const hd=cpuHand();
      if(Math.hypot(ball.x-hd.x,ball.y-hd.y)<18){blocked(d,!early);return;}
    }
    if((early||saveZone) && ball.shooter===d && playerArmUp()){
      const hd=playerHand();
      if(Math.hypot(ball.x-hd.x,ball.y-hd.y)<18){blocked(p,!early);return;}
    }
    if(ball.make){ if(t>=ball.T) arrive(t); }
    else if(hit || t>=ball.T+0.25 || ball.y>FLOOR-BALL_R) missNow();
  } else if(ball.state==="free"){
    ball.timer+=dt;
    const n=4, h=dt/n;
    for(let k=0;k<n;k++){
      const prevY=ball.y;
      ball.vy+=GB*h; ball.x+=ball.vx*h; ball.y+=ball.vy*h;
      collideHoops(); floorAndWalls();
      if(ball.live && ball.timer<4) checkRollIn(prevY);
      if(ball.state!=="free") break;
    }
    if(ball.y>=FLOOR-BALL_R-0.5 && ball.vy===0) ball.vx*=Math.max(0,1-1.3*dt);   // rolling slows down on the floor
    if(ball.state!=="free"){}   // it just rolled in: nobody can grab it
    else if(!cpuOn){ if(ball.timer>1.6) inbound("p"); }
    else if(ball.timer>0.25){
      for(const e of [p,d]){
        if(Math.abs(ball.x-e.x)<24 && ball.y>e.y-92){takeBall(e);break;}
      }
      if(ball.state==="free" && ball.timer>6) takeBall(Math.abs(ball.x-p.x)<Math.abs(ball.x-d.x)?p:d);
    }
  } else if(ball.state==="made"){
    // ball slides down through the net, then drops out of the bottom
    ball.timer+=dt; ball.y+=150*dt;
    if(ball.y>RR.y+40){ball.state="drop"; ball.vy=170; ball.vx=0;}
  } else if(ball.state==="drop"){
    ball.vy+=GB*dt; ball.y+=ball.vy*dt;
    if(ball.y>FLOOR-8){ball.y=FLOOR-8; ball.vy*=-0.55; if(Math.abs(ball.vy)<40) ball.vy=0;}
  }
  updateNets(dt); updateFx(dt); if(tip.fade>0) tip.fade-=dt;
  if(msg.t>0) msg.t-=dt;
  if(celebrate.t>0) celebrate.t-=dt;
  if(dblFx.t>0) dblFx.t-=dt;
  if(cpuFx.t>0) cpuFx.t-=dt;
  if(dblMiss>0) dblMiss-=dt;
  for(const s of [moods.p,moods.d]) if(s.t>0){s.t-=dt; if(s.t<=0) s.m="happy";}
  trackRun(dt);
}
function trackRun(dt){
  for(const e of [p,d]){
    if(e.lx===undefined) e.lx=e.x;
    e.spd=(e.x-e.lx)/Math.max(dt,0.001); e.lx=e.x;
    e.run=(e.run||0)+Math.abs(e.spd)*dt*0.09;
  }
}

function startDunk(){
  Object.assign(dunk,{on:true,t:0,x0:p.x,success:Math.random()<0.5,resolved:false,hang:0,wind:false,w0:0});
  p.ground=false; p.vy=0; needRelease=true; stats.att++; d.jumped=false;
  lastShot="Dunk attempt · 50% chance";
}
function startCpuDunk(){
  const wind=Math.random()<SKILL.windTry;   // the computer sometimes goes for a windmill too
  Object.assign(cdunk,{on:true,t:0,x0:d.x,success:Math.random()<(wind?WIND_MAKE:SKILL.dunkMake),resolved:false,hang:0,wind,w0:0.06});
  d.ground=false; d.vy=0;
  lastShot=NAME.d+" is going for the dunk!";
}
function updateDunk(dt){ runDunk(dunk,p,1,RR,DUNK_X,dt); }
function runDunk(dk,e,dir,rim,dunkX,dt){
  dk.t+=dt; const t=dk.t;
  if(t<RISE){
    const u=t/RISE;
    e.x=dk.x0+(dunkX-dk.x0)*(1-(1-u)*(1-u));
    e.y=FLOOR-85*Math.sin(u*Math.PI/2);
  } else if(t<RISE+SLAM){
    const u=(t-RISE)/SLAM; e.x=dunkX; e.y=FLOOR-85+45*u;
  } else {
    if(!dk.resolved) resolveDunk(dk,e,dir,rim,dunkX);
    const t2=t-RISE-SLAM;
    if(t2<dk.hang){e.x=dunkX;e.y=FLOOR-40;}
    else {
      const u=Math.min(1,(t2-dk.hang)/DROP); e.x=dunkX-dir*10*u; e.y=FLOOR-40+40*u*u;
      if(u>=1){e.y=FLOOR;e.ground=true;e.vy=0;dk.on=false;}
    }
  }
}
function resolveDunk(dk,e,dir,rim,dunkX){
  dk.resolved=true;
  const byP=e===p;
  // the defender can stuff a dunk: the CPU has a small chance if it is close,
  // you get a bigger chance if you are in the air near the rim at the slam
  const stuffed = byP
    ? (cpuOn && Math.abs(d.x-dunkX)<80 && Math.random()<SKILL.blockDunk)
    : (!p.ground && Math.abs(p.x-dunkX)<75 && Math.random()<0.5);
  if(stuffed){
    dk.hang=0.02; shakeT=0.15; owner=null; if(byP) stats.streak=0;
    Object.assign(ball,{state:"free",x:rim.x-dir*14,y:rim.y-10,vx:-dir*(120+Math.random()*60),vy:-120,timer:0,dunk:true,live:false});
    say(pick("block"), byP?"Stuffed at the rim!":"You stuffed "+NAME.d+"'s dunk!", byP?C.warn:C.info);
    lastShot = byP ? "Your dunk was blocked" : "You blocked "+NAME.d+"'s dunk"; if(!byP) stats.blk++;
    setMood(e,"shock"); setMood(byP?d:p,"happy"); celebrateFor(byP?d:p);
    return;
  }
  dk.hang=dk.success?0.32:0.02; shakeT=dk.success?0.3:0.12;
  Object.assign(ball,{shooter:e,make:dk.success,pts:2,far:false,fade:false,dunk:true,wind:!!dk.wind});
  if(dk.success){ startBoardFx(byP?"R":"L",dk.wind); if(dk.wind) startCrackFx(); arrive(0); }
  else {
    owner=null; if(byP) stats.streak=0;
    Object.assign(ball,{state:"free",x:rim.front-dir*4,y:rim.y-8,vx:-dir*(150+Math.random()*90),vy:-280,timer:0,live:false});
    say(pick("dunkMiss"), byP?(cpuOn?"Grab the rebound!":"50/50, try again!"):NAME.d+" missed the dunk! Grab it!", byP?C.warn:C.info);
    lastShot = byP ? "Dunk missed" : NAME.d+" missed the dunk";
    setMood(e,"grump");
  }
}
function setCpuPlan(){
  cpu.charging=false;
  cpu.dunk=Math.random()<SKILL.dunkTry;
  cpu.spot=cpu.dunk ? 115+Math.random()*40 : pickSpot();
}
function blocked(by,save){
  play("smack");
  const shooterDir = ball.shooter===p ? 1 : -1;
  ball.state="free"; ball.timer=0; ball.live=false;
  if(save){ball.vx=-shooterDir*(140+Math.random()*70); ball.vy=-90;}   // swatted away from the hoop
  else {ball.vx=shooterDir*60; ball.vy=60;}
  if(by===d){
    stats.streak=0;
    say(pick(save?"save":"block"),save?NAME.d+" saved it at the rim!":"Blocked! Try a fade-away: pull back while you hold SHOOT",C.warn);
    lastShot=save?"Saved by "+NAME.d:"Blocked by the defender";
  } else {
    say(pick(save?"save":"block"),save?"What a save! Grab the ball!":"You blocked it! Grab the ball!",C.info);
    lastShot=(save?"You saved it from ":"You blocked ")+NAME.d; stats.blk++;
  }
  setMood(by===d?p:d,"shock"); setMood(by,"happy"); celebrateFor(by);
}
function arrive(t){
  const byP=ball.shooter===p, rim=byP?RR:RL;
  if(ball.make){
    ball.state="made"; ball.x=rim.x; ball.y=rim.y; ball.timer=0;
    netKick(byP?1:0, ball.dunk?9:3, ball.dunk?(byP?2:-2):0); // swish, or a hard yank on a dunk
    if(ball.dunk) play("slam"); else play("swish");
    play("cheer", ball.wind?1.8:(ball.dunk?1.4:(ball.far?1.6:(ball.lucky?0.8:(ball.pts===3?1.15:0.75)))));
    if(byP){
      stats.score+=ball.pts; stats.made++; if(ball.pts===3) stats.threes++; if(ball.dunk) stats.dunks++; stats.streak++; stats.best=Math.max(stats.best,stats.streak);
      const cat=ball.lucky?"lucky":ball.wind?"windmill":(ball.dunk?"dunk":(ball.far?"half":(ball.fade?"fade":(stats.streak>=3?"fire":(ball.pts===3?"three":"two")))));
      say(pick(cat), "+"+ball.pts+(stats.streak>1?" · "+stats.streak+" in a row":""), C.green);
      setMood(p,"happy"); setMood(d,"grump");
      if(BIG_PLAYS.includes(cat)) celebrateFor(p);
    } else {
      stats.cpu+=ball.pts;
      const cat=ball.lucky?"lucky":ball.wind?"windmill":(ball.dunk?"dunk":(ball.far?"half":(ball.fade?"fade":(ball.pts===3?"three":"two"))));
      say(pick(cat),NAME.d+" +"+ball.pts,C.warn);
      setMood(d,"happy"); setMood(p,"grump");
      if(BIG_PLAYS.includes(cat)) celebrateFor(d);
    }
    if(cpuOn && (stats.score>=WIN||stats.cpu>=WIN)){
      const youWin=stats.score>=WIN;
      say((youWin?NAME.p:NAME.d).toUpperCase()+" WINS!", stats.score+" – "+stats.cpu, youWin?C.green:C.warn);
      msg.t=3; gameOverT=3; SND.last.whistle=0; play("whistle",true);
      setMood(youWin?p:d,"happy",3); setMood(youWin?d:p,"grump",3); celebrateFor(youWin?p:d,3);
    }
    pendingInbound = cpuOn ? (byP?"d":"p") : "p"; inboundT=1.1;
  } else {
    ball.vy=ball.vy+GB*t; missNow();
  }
}
function missNow(){
  const byP=ball.shooter===p;
  ball.state="free"; ball.timer=0; ball.live=true;
  {
    if(byP){
      stats.streak=0;
      const tip={behind:"Get in front of the basket to shoot",auto:"Let go before the bar is full",air:"Way too early, hold a bit longer",short:"A little early, hold longer",long:"A little late, let go sooner"}[ball.missType];
      say(pick(ball.missType), tip+(cpuOn?" · grab the rebound!":""), C.warn); play("groan");
      setMood(p,"grump");
    } else {
      say(pick(ball.missType),NAME.d+" missed! Grab the rebound!",C.info);
      setMood(d,"grump");
    }
  }
}

// a defender jump; about 1 in 3 of them turns into a double jump at the top
function cpuJump(v){d.vy=v; d.ground=false; d.dbl=false; d.willDbl=Math.random()<SKILL.dblChance;}
function cpuUpdate(dt){
  if(tip.on){ updateTip(dt); body(d,dt); return; }
  if(cdunk.on){ runDunk(cdunk,d,-1,RL,CPU_DUNK_X,dt); return; }
  if(owner===d && ball.state==="held"){
    // attacking the left hoop
    if(!cpu.charging){
      const step=SKILL.atkSpeed*dt;
      if(Math.abs(cpu.spot-d.x)<=step){
        d.x=cpu.spot;
        if(cpu.dunk && d.ground){ startCpuDunk(); return; }
        cpu.charging=true; cpu.t=0; cpu.hold=0.9+Math.random()*0.5;
        cpu.fade = p.x<d.x && d.x-p.x<75 && Math.random()<SKILL.fadeChance;
      } else d.x+=Math.sign(cpu.spot-d.x)*step;
    } else {
      cpu.t+=dt; if(cpu.fade) d.x=Math.min(d.x+40*dt,800);
      if(cpu.t>=cpu.hold) cpuRelease();
    }
  } else if(ball.state==="flight" && ball.shooter===p){
    const target=RR.x+8, step=SKILL.chaseSpeed*dt;   // hand reaches just in front of the rim
    if(Math.abs(target-d.x)>step) d.x+=Math.sign(target-d.x)*step;
    if(!ball.saveTried && d.ground && ball.T-ball.t<=0.36 && Math.abs(d.x-target)<40){
      ball.saveTried=true; if(Math.random()<SKILL.saveChance) cpuJump(-380);
    }
  } else if(ball.state==="free"){
    const step=SKILL.chaseSpeed*dt;
    if(Math.abs(ball.x-d.x)>step) d.x+=Math.sign(ball.x-d.x)*step;
  } else if(owner===p && ball.state==="held"){
    // defending the right hoop
    const target=clamp(p.x+60,60,800), step=SKILL.defSpeed*dt;
    if(Math.abs(target-d.x)<step) d.x=target; else d.x+=Math.sign(target-d.x)*step;
    const close=d.x>p.x && d.x-p.x<110;
    // contest a dunk by jumping with it
    if(dunk.on && !d.jumped && d.ground && Math.abs(d.x-DUNK_X)<90 && dunk.t>0.08){cpuJump(-400);d.jumped=true;}
    if(charge.on && d.react!==null && !d.jumped && d.ground && charge.holdT>=d.react && close){
      cpuJump(-380); d.jumped=true;
    }
    // sometimes he bites on nothing and jumps anyway
    if(!charge.on && d.ground && close && Math.random()<0.22*dt){cpuJump(-380);}
  }
  // random double jump at the top of a block jump
  if(!d.ground && d.willDbl && !d.dbl && cpuDefending() && Math.abs(d.vy)<APEX_VY){
    d.vy=-380; d.dbl=true; cpuFx={t:0.45,x:d.x,y:d.y};
  }
  d.lean+=(((cpu.charging&&cpu.fade)?0.25:0)-d.lean)*Math.min(1,dt*12);
  body(d,dt);
}

// ---------- drawing ----------
function rr(x,y,w,h,r){ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h);}
function line(x1,y1,x2,y2,col,w){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function text(t,x,y,font,col,align){ctx.font=font;ctx.fillStyle=col;ctx.textAlign=align||"left";ctx.textBaseline="middle";ctx.fillText(t,x,y);}
const DISP=s=>s+'px Bungee, "Arial Black", Impact, sans-serif';
const BODY=(s,w)=>(w||800)+" "+s+'px Nunito, system-ui, sans-serif';
const NET=[[2,0,9,26],[13,0,16,26],[27,0,24,26],[38,0,31,26],[5,9,35,9],[7,18,33,18],[9,26,31,26]];
// ---------- nets: a hanging string mesh that the ball pushes through ----------
// Each net is a grid of points (top row tied to the rim) joined by diagonal strings that make the
// diamond pattern. Points move with simple verlet physics, are pulled gently back to their rest
// shape, and get shoved aside by the ball, so the net bulges, stretches and swings.
const NET_COLS=6, NET_ROWS=5;
function makeNet(rimX){
  const pts=[], links=[];
  for(let r=0;r<=NET_ROWS;r++){
    const w=40-(r/NET_ROWS)*17;               // tapers toward the bottom
    for(let c=0;c<=NET_COLS;c++){
      const x=rimX+20+(c/NET_COLS-0.5)*w, y=189+r*6.6;
      pts.push({x,y,px:x,py:y,rx:x,ry:y,fixed:r===0});
    }
  }
  const id=(r,c)=>r*(NET_COLS+1)+c;
  const link=(a,b,front)=>{const A=pts[a],B=pts[b]; links.push({a,b,len:Math.hypot(A.x-B.x,A.y-B.y),front});};
  for(let r=0;r<NET_ROWS;r++) for(let c=0;c<=NET_COLS;c++){
    if(c<NET_COLS){ link(id(r,c),id(r+1,c+1),true); link(id(r,c+1),id(r+1,c),false); }
    if(c===0||c===NET_COLS) link(id(r,c),id(r+1,c),true);   // side edges
  }
  for(let c=0;c<NET_COLS;c++) link(id(NET_ROWS,c),id(NET_ROWS,c+1),true); // bottom hem
  return {pts,links};
}
const NETS=[makeNet(67),makeNet(737)];
function netKick(i,down,side){
  for(const pt of NETS[i].pts){ if(pt.fixed) continue; const k=(pt.ry-189)/(NET_ROWS*6.6);
    pt.py-=down*k; pt.px-=(side||0)*k; }
}
function updateNets(dt){
  const loose=ball.state!=="held";
  for(const net of NETS){
    for(const pt of net.pts){
      if(pt.fixed) continue;
      const vx=(pt.x-pt.px)*0.9, vy=(pt.y-pt.py)*0.9;
      pt.px=pt.x; pt.py=pt.y;
      pt.x+=vx; pt.y+=vy+260*dt*dt;
      pt.x+=(pt.rx-pt.x)*0.07; pt.y+=(pt.ry-pt.y)*0.07;
      if(loose){
        const dx=pt.x-ball.x, dy=pt.y-ball.y, dd=Math.hypot(dx,dy);
        if(dd<10.5 && dd>0.01){pt.x=ball.x+dx/dd*10.5; pt.y=ball.y+dy/dd*10.5;}
      }
    }
    for(let it=0;it<3;it++) for(const L of net.links){
      const A=net.pts[L.a], B=net.pts[L.b], dx=B.x-A.x, dy=B.y-A.y, dd=Math.hypot(dx,dy)||1;
      if(dd<=L.len*1.08) continue;                  // strings can go slack but not stretch much
      const f=(dd-L.len*1.08)/dd*0.5;
      if(!A.fixed){A.x+=dx*f; A.y+=dy*f;}
      if(!B.fixed){B.x-=dx*f; B.y-=dy*f;}
    }
  }
}
function drawNetLayer(front){
  ctx.lineCap="round";
  ctx.strokeStyle=front?"rgba(250,248,242,0.95)":"rgba(205,212,228,0.55)";
  ctx.lineWidth=front?1.4:1.1;
  ctx.beginPath();
  for(const net of NETS) for(const L of net.links){
    if(L.front!==front) continue;
    const A=net.pts[L.a], B=net.pts[L.b];
    ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y);
  }
  ctx.stroke();
  if(front){ // little knots where the strings cross
    ctx.fillStyle="rgba(250,248,242,0.9)";
    for(const net of NETS) for(const pt of net.pts){ if(pt.fixed) continue; ctx.fillRect(pt.x-0.8,pt.y-0.8,1.6,1.6); }
  }
}
function drawHoop(side){
  const L=side==="L";
  const poleX=L?32:804, armX=L?38:782, boardX=L?60:777, rimX=L?67:737;
  ctx.fillStyle=C.steel; ctx.fillRect(poleX,168,8,142); ctx.fillRect(armX,168,24,6);
  if(!boardGone(side)){ctx.fillStyle=C.chalk; rr(boardX,140,7,62,2); ctx.fill();}
  else {ctx.fillStyle="rgba(205,235,255,0.8)"; ctx.fillRect(boardX,140,7,6); ctx.fillRect(boardX,196,7,6);}   // only jagged edges left
  ctx.fillStyle=C.ball; rr(rimX,184,40,5,3); ctx.fill();
  // net hooks under the rim
  ctx.fillStyle=C.chalk; for(let i=0;i<=NET_COLS;i++) ctx.fillRect(rimX+20+(i/NET_COLS-0.5)*40-1,188,2,3);
}

// emblem shapes, drawn in a unit circle (radius 1) centred on 0,0
function emblemShape(kind){

const ROADS=ARENAS.map((a,i)=>{const lum=hex2rgb(a.p).reduce((t,v,k)=>t+v*[0.2126,0.7152,0.0722][k],0)/255;
  return {name:"LEVEL "+(i+1),col:lum>0.2?a.p:a.s,arena:a.name};});
const STOPS=7, STOP_GAP=58, STOP_R=20, ROAD_GAP=150, BOTTOM_PAD=92;
let mapScroll=null, mapDrag=null, mapMsg={text:"",t:0};   // null = scroll to the current level next time the map is drawn
// roads climb upward: road 1 at the bottom, stop 1 at the bottom of each road
const LEAD=56;   // straight stretch (about 1 cm on a phone) from stop 1 before the zig-zag begins
// the same straight stretch is used at both ends: after stop 1 and before stop 7
function upY(r,i){return BOTTOM_PAD+r*((STOPS-1)*STOP_GAP+2*LEAD+ROAD_GAP)+i*STOP_GAP+(i>0?LEAD:0)+(i===STOPS-1?LEAD:0);}   // height above the bottom of the map
function mapContentH(){return upY(ROADS.length-1,STOPS-1)+STOP_R+30;}
function stopPos(r,i){ // map-local position of stop i (0-6) on road r; stops alternate sides to make the zig-zag
  // first and last stop sit in the middle; the ones between alternate right and left
  const x = (i===0||i===STOPS-1) ? MAP.w/2 : (i%2===1 ? MAP.w-62 : 62);
  return {x:MAP.x+x, y:mapContentH()-upY(r,i)};
}
const VIEW={y:MAP.y+48,h:MAP.h-48};   // the scrolling part of the map, under the Zackie/Keelan tabs
function mapMaxScroll(){return Math.max(0,mapContentH()-VIEW.h);}
// ---------- levels: every stop is a 1 v 1 game, each one a bit harder than the last ----------
const LEVELS=ROADS.length*STOPS;
let progress={zackie:0,keelan:0}, level=0, newRoad=false;   // progress = how many levels that boy has beaten
function levelName(n){return "Level "+(Math.floor(n/STOPS)+1)+" · Part "+(n%STOPS+1);}
function levelTarget(n){const lv=Math.floor(n/STOPS); return lv<10?11:(lv<20?15:21);}   // longer games in later levels
function levelSkill(n){
  const t=n/(LEVELS-1), L=(a,b)=>a+(b-a)*t;   // level 1 = easiest, last level = hardest
  return {acc:L(0.6,1.25), noReact:L(0.5,0.06), timingNoise:L(0.6,0.16), defSpeed:L(115,195), chaseSpeed:L(135,210),
    atkSpeed:L(100,165), fadeChance:L(0.25,0.85), dunkTry:L(0.08,0.45), dunkMake:L(0.38,0.62), blockDunk:L(0.08,0.42),
    dblChance:L(0.05,0.5), stealChance:L(0.6,0.3), saveChance:L(0.08,0.45), windTry:L(0.1,0.4)};
}
let pickByPlayer=false;   // true when the level comes from the 1 v 1 button, so either boy can pick up his own next level
function openLevel(n,byPlayer){level=n; mode="level"; screen="setup"; pickByPlayer=!!byPlayer;}
function openNextLevel(){openLevel(Math.min(progress[human],LEVELS-1),true);}
function tapMap(q){
  const cy=q.y-VIEW.y+mapScroll;
  for(let r=0;r<ROADS.length;r++) for(let i=0;i<STOPS;i++){
    const s=stopPos(r,i), n=r*STOPS+i;
    if(Math.hypot(q.x-s.x,cy-s.y)<STOP_R+10){
      if(n<=progress[human]) openLevel(n);
      else mapMsg={text:"Win "+levelName(progress[human])+" first",t:1.8};
      return;
    }
  }
}
// a full basketball court seen from above, standing upright: hoops at the top and bottom, emblem at centre court
function drawMiniCourt(a,top,bot,open){
  const x0=MAP.x+18, x1=MAP.x+MAP.w-24, w=x1-x0, cx=(x0+x1)/2, cy=(top+bot)/2, h=bot-top;
  const line="rgba(255,255,255,0.92)";
  ctx.save();
  rr(x0-6,top-6,w+12,h+12,10); ctx.fillStyle=mix(a.p,"#0B1020",0.45); ctx.fill();   // out-of-bounds border in arena colour
  ctx.fillStyle=a.wood; ctx.fillRect(x0,top,w,h);
  ctx.fillStyle="rgba(0,0,0,0.07)"; for(let x=x0+13;x<x1;x+=13) ctx.fillRect(x,top,1,h);   // floor boards
  ctx.save(); ctx.beginPath(); ctx.rect(x0,top,w,h); ctx.clip();
  // centre-court emblem
  drawEmblem(a,cx,cy,Math.min(70,w*0.27));
  ctx.strokeStyle=line; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x0,cy); ctx.lineTo(x1,cy); ctx.stroke();                      // half-court line
  ctx.beginPath(); ctx.arc(cx,cy,Math.min(74,w*0.29)+2,0,Math.PI*2); ctx.stroke();          // centre circle
  // each end: painted key, free-throw circle, three-point line, backboard and hoop
  const keyW=w*0.3, keyH=h*0.19, arcR=w*0.44, hoopIn=h*0.055;
  for(const end of [-1,1]){
    const base=end<0?top:bot, dir=end<0?1:-1, hoopY=base+dir*hoopIn;
    ctx.fillStyle=a.p; ctx.globalAlpha=0.85; ctx.fillRect(cx-keyW/2,end<0?base:base-keyH,keyW,keyH); ctx.globalAlpha=1;
    ctx.strokeStyle=line; ctx.lineWidth=2; ctx.strokeRect(cx-keyW/2,end<0?base:base-keyH,keyW,keyH);
    const ftY=base+dir*keyH;
    ctx.beginPath(); ctx.arc(cx,ftY,keyW/2,end<0?0:Math.PI,end<0?Math.PI:Math.PI*2); ctx.stroke();
    // three-point line: straight in the corners, then an arc round the hoop
    const side=w*0.06, cornerLen=h*0.09;
    ctx.beginPath(); ctx.moveTo(x0+side,base); ctx.lineTo(x0+side,base+dir*cornerLen);
    const ang=Math.asin(Math.min(1,(cx-x0-side)/arcR)), startDy=Math.cos(ang)*arcR;
    const centreY=base+dir*cornerLen-dir*startDy;
    if(end<0) ctx.arc(cx,centreY,arcR,Math.PI/2+ang,Math.PI/2-ang,true);
    else ctx.arc(cx,centreY,arcR,-Math.PI/2-ang,-Math.PI/2+ang,false);
    ctx.lineTo(x1-side,base); ctx.stroke();
    ctx.strokeStyle="#FFFFFF"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx-14,base+dir*hoopIn*0.45); ctx.lineTo(cx+14,base+dir*hoopIn*0.45); ctx.stroke();
    ctx.strokeStyle="#F26B1D"; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(cx,hoopY+dir*4,6,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle=line; ctx.lineWidth=2.5; ctx.strokeRect(x0,top,w,h);   // boundary
  if(!open){ctx.fillStyle="rgba(10,14,30,0.6)"; ctx.fillRect(x0-6,top-6,w+12,h+12);}   // locked levels are dimmed
  ctx.restore();
}
function padlock(x,y,col){
  ctx.strokeStyle=col; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y-3,3.6,Math.PI,0); ctx.stroke();
  ctx.fillStyle=col; rr(x-5.5,y-3,11,8,2); ctx.fill();
}
function scrollMap(dy){mapScroll=clamp(mapScroll+dy,0,mapMaxScroll());}
function drawRoadMap(){
  const prog=progress[human];
  if(mapScroll===null){ // centre on the level this boy should play next
    const n=Math.min(prog,LEVELS-1), sp=stopPos(Math.floor(n/STOPS),n%STOPS);
    mapScroll=clamp(sp.y-VIEW.h*0.62,0,mapMaxScroll());
  }
  ctx.save();
  ctx.fillStyle="rgba(16,21,43,0.96)"; rr(MAP.x,MAP.y,MAP.w,MAP.h,18); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,0.14)"; ctx.lineWidth=2; ctx.stroke();
  // whose map: one tab per boy
  const tw=(MAP.w-30)/2;
  ["zackie","keelan"].forEach((boy,k)=>{
    const x=MAP.x+10+k*(tw+10), sel=boy===human, col=MAINS[kits[boy].main];
    ctx.fillStyle=sel?col:"rgba(46,56,102,0.9)"; rr(x,MAP.y+9,tw,32,12); ctx.fill();
    if(sel){ctx.strokeStyle=C.ink; ctx.lineWidth=2; ctx.stroke();}
    text(BOYS[boy].name.toUpperCase()+"  ·  LVL "+Math.min(Math.floor(progress[boy]/STOPS)+1,ROADS.length),x+tw/2,MAP.y+26,BODY(13,900),sel?inkOn(col):C.muted,"center");
    ui.push({x,y:MAP.y+5,w:tw,h:40,fn:()=>{if(human!==boy){human=boy; mapScroll=null; saveGame();}}});
  });
  ctx.beginPath(); ctx.rect(MAP.x,VIEW.y,MAP.w,VIEW.h); ctx.clip();
  ctx.translate(0,VIEW.y-mapScroll);
  const locked="#39416A", pulse=1+0.12*Math.sin(performance.now()/180);
  ROADS.forEach((road,r)=>{
    const start=stopPos(r,0), open=r*STOPS<=prog;
    const courtTop=stopPos(r,STOPS-1).y-32, courtBot=start.y+30;
    if(courtBot+80<mapScroll || courtTop>mapScroll+VIEW.h) return;   // off screen
    // the level sits on its arena's court seen from above, with the emblem at centre court
    drawMiniCourt(ARENAS[r],courtTop,courtBot,open);
    text(road.name+(open?"":" · LOCKED"),MAP.x+MAP.w/2,courtBot+20,DISP(15),open?C.ink:C.muted,"center");
    text(road.arena,MAP.x+MAP.w/2,courtBot+38,BODY(11,800),C.muted,"center");
    // the road: straight lines between the stops; the part leading to locked levels is grey
    const pts=[];
    for(let i=0;i<STOPS;i++){const sp=stopPos(r,i);
      if(i===0){pts.push([sp.x,sp.y,0]); pts.push([sp.x,sp.y-LEAD,1]);}
      else if(i===STOPS-1){pts.push([sp.x,sp.y+LEAD,i]); pts.push([sp.x,sp.y,i]);}
      else pts.push([sp.x,sp.y,i]);}
    ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.strokeStyle="rgba(10,14,30,0.55)"; ctx.lineWidth=9;   // dark edge so the road stands out on the wood
    ctx.beginPath(); pts.forEach(([x,y],k)=>k?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke();
    ctx.lineWidth=5;
    for(let k=0;k<pts.length-1;k++){
      ctx.strokeStyle=(r*STOPS+pts[k+1][2]<=prog)?road.col:locked;
      ctx.beginPath(); ctx.moveTo(pts[k][0],pts[k][1]); ctx.lineTo(pts[k+1][0],pts[k+1][1]); ctx.stroke();
    }
    // the levels
    for(let i=0;i<STOPS;i++){
      const sp=stopPos(r,i), n=r*STOPS+i, done=n<prog, cur=n===prog, R=cur?STOP_R*1.1:STOP_R;
      if(cur){ctx.strokeStyle=C.warn; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(sp.x,sp.y,(STOP_R+7)*pulse,0,Math.PI*2); ctx.stroke();}
      ctx.fillStyle=(done||cur)?road.col:locked; ctx.beginPath(); ctx.arc(sp.x,sp.y,R,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle=(done||cur)?C.ink:"rgba(255,255,255,0.35)"; ctx.lineWidth=3; ctx.stroke();
      text(String(i+1),sp.x,sp.y+1,DISP(18),(done||cur)?inkOn(road.col):"rgba(255,255,255,0.45)","center");
      if(done){ // gold tick badge for a beaten level
        ctx.fillStyle=C.warn; ctx.beginPath(); ctx.arc(sp.x+15,sp.y-14,8,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle=C.navy; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(sp.x+11,sp.y-14); ctx.lineTo(sp.x+14,sp.y-11); ctx.lineTo(sp.x+19,sp.y-17); ctx.stroke();
      } else if(!cur){
        ctx.fillStyle=C.navy; ctx.beginPath(); ctx.arc(sp.x+15,sp.y+14,8,0,Math.PI*2); ctx.fill();
        padlock(sp.x+15,sp.y+15,C.muted);
      }
      if(cur){const left=sp.x>MAP.x+MAP.w/2, tx=sp.x+(left?-1:1)*(R+12);
        ctx.font=DISP(13); ctx.textAlign=left?"right":"left"; ctx.textBaseline="middle";
        ctx.lineWidth=4; ctx.lineJoin="round"; ctx.strokeStyle=C.navy; ctx.strokeText("PLAY",tx,sp.y+1);
        ctx.fillStyle=C.warn; ctx.fillText("PLAY",tx,sp.y+1);}
    }
  });
  ctx.restore();
  // scroll bar
  const max=mapMaxScroll();
  if(max>0){
    const track=VIEW.h-20, bar=Math.max(36,track*VIEW.h/(VIEW.h+max)), by=VIEW.y+10+(track-bar)*(mapScroll/max);
    ctx.fillStyle="rgba(255,255,255,0.12)"; rr(MAP.x+MAP.w-10,VIEW.y+10,4,track,2); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,0.55)"; rr(MAP.x+MAP.w-10,by,4,bar,2); ctx.fill();
  }
  if(mapMsg.t>0){
    mapMsg.t-=1/60;
    ctx.globalAlpha=Math.min(1,mapMsg.t*3);
    ctx.font=BODY(13,900); const w=ctx.measureText(mapMsg.text).width+24;
    ctx.fillStyle="rgba(10,14,30,0.95)"; rr(MAP.x+MAP.w/2-w/2,MAP.y+MAP.h-44,w,30,12); ctx.fill();
    text(mapMsg.text,MAP.x+MAP.w/2,MAP.y+MAP.h-29,BODY(13,900),C.warn,"center");
    ctx.globalAlpha=1;
  }
}
function inMap(q){return q.x>=MAP.x&&q.x<=MAP.x+MAP.w&&q.y>=VIEW.y&&q.y<=VIEW.y+VIEW.h;}

function swatch(cx,cy,r,col,sel,disabled,fn){
  ctx.globalAlpha=disabled?0.25:1;
  if(sel){ctx.strokeStyle=C.warn; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(cx,cy,r+4,0,Math.PI*2); ctx.stroke();}
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,0.7)"; ctx.lineWidth=1.5; ctx.stroke();
  if(disabled){ctx.strokeStyle=C.ink; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx-r*0.7,cy+r*0.7); ctx.lineTo(cx+r*0.7,cy-r*0.7); ctx.stroke();}
  ctx.globalAlpha=1;
  if(!disabled) ui.push({x:cx-r-3,y:cy-r-3,w:2*r+6,h:2*r+6,fn});
}
function playerCard(boy,x,y,w,h){

  ctx.strokeStyle=sel?C.warn:"rgba(255,255,255,0.15)"; ctx.lineWidth=sel?4:2; ctx.stroke();

  const tx=x+160;
  text(b.name.toUpperCase(),tx,y+30,DISP(24),C.ink); text("#"+b.num,x+w-16,y+30,DISP(20),C.muted,"right");

  let nm=bl[bi].name, fs=13; ctx.font=BODY(fs,900); while(fs>9 && ctx.measureText(nm).width>x+w-tx-118){fs--; ctx.font=BODY(fs,900);}
  text(nm,tx+74,by-5,BODY(fs,900),C.ink); text(open.length+" of "+bl.length+" unlocked",tx+74,by+10,BODY(10,800),C.muted);
  button(x+w-46,by-15,30,30,"›",{size:20},cyc(1));
  const hint=sel?"Ready to play":((mode==="level"&&!pickByPlayer)?"Plays as the computer":"Tap the card to "+(mode==="practice"?"pick ":"play as ")+b.name);

// two-segment limb from a joint to an end point, bending the middle joint toward (px,py)
function limb(sx,sy,ex,ey,L,prefX,prefY,w1,w2,col){
  const dx=ex-sx, dy=ey-sy, dist=Math.hypot(dx,dy)||1;
  let mx=sx+dx/2, my=sy+dy/2;
  if(dist<2*L){
    const h=Math.sqrt(L*L-(dist/2)*(dist/2)); let nx=-dy/dist, ny=dx/dist;
    if(nx*prefX+ny*prefY<0){nx=-nx;ny=-ny;}
    mx+=nx*h; my+=ny*h;
  }
  line(sx,sy,mx,my,col,w1); line(mx,my,ex,ey,col,w2);
  return {mx,my};
}

  text(Math.round(pw)+"%",x,y+h+16,DISP(16),(pw>=range[0]&&pw<=range[1])?C.green:C.ink);
  text(z.name.toUpperCase()+(fade?" · FADE":""),x,y+h+36,BODY(11,900),C.muted);
}
function drawHUD(){
  ctx.fillStyle=C.panel; rr(PAUSE_BTN.x,PAUSE_BTN.y,PAUSE_BTN.w,PAUSE_BTN.h,12); ctx.fill();
  ctx.fillStyle=C.ink; ctx.fillRect(29,25,5,18); ctx.fillRect(38,25,5,18);
  const pill=(x,w,lk,bg,name,score)=>{
    const ink=inkOn(bg);
    ctx.fillStyle=bg; rr(x,14,w,40,20); ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,0.35)"; ctx.lineWidth=1.5; ctx.stroke();
    faceBadge(lk,x+20,34,17,mix(bg,"#FFFFFF",0.3));
    text(name.toUpperCase(),x+43,34,BODY(13,900),ink); text(String(score),x+w-10,35,DISP(24),ink,"right");
  };
  pill(64,166,LOOK.p,C.p1,NAME.p,stats.score);
  if(cpuOn) pill(238,166,LOOK.d,C.p2,NAME.d,stats.cpu);
  const px=cpuOn?412:238, pw=W-16-px, cx=px+pw/2;
  ctx.fillStyle="rgba(46,56,102,0.95)"; rr(px,14,pw,40,12); ctx.fill();
  if(tip.on){
    text("JUMP BALL",cx,26,BODY(11,900),C.warn,"center");
    text("The ball drops after the countdown: tap JUMP to win it",cx,42,BODY(13,900),C.ink,"center");
  } else if(cpuOn && playerDefending()){
    text("DEFENSE · FIRST TO "+WIN,cx,26,BODY(11,900),C.warn,"center");
    text("JUMP to block · joystick down towards him + STEAL to steal",cx,42,BODY(12,900),C.ink,"center");
  } else if(cpuOn && owner!==p && ball.state==="free"){
    text("LOOSE BALL!",cx,26,BODY(11,900),C.warn,"center");
    text("Run to the ball to grab it",cx,42,BODY(13,900),C.ink,"center");
  } else if(owner===p && inKey(p.x)){
    text((cpuOn?"YOUR BALL · ":"PRACTICE · ")+"DUNK ZONE",cx,26,BODY(11,900),C.muted,"center");
    text("Tap DUNK (50%) · push joystick UP in the air for a WINDMILL",cx,42,BODY(12,900),C.ink,"center");
  } else {
    const z=zoneFor(p.x,RR);
    text((cpuOn?"YOUR BALL · ":"PRACTICE · ")+z.name.toUpperCase(),cx,26,BODY(11,900),z.behind?C.warn:C.muted,"center");
    text(z.behind?"Can't score from here: move in front of the basket":"sweet spot "+z.n[0]+"–"+z.n[1]+" · fade "+z.f[0]+"–"+z.f[1]+(z.fill?" · fast bar!":""),cx,42,BODY(13,900),C.ink,"center");
  }
  ctx.font=BODY(13,800); const tw=ctx.measureText(lastShot).width+28;
  ctx.fillStyle="rgba(27,35,64,0.92)"; rr(W/2-tw/2-20,360,tw,26,10); ctx.fill();
  text(lastShot,W/2-20,373,BODY(13,800),C.ink,"center");
}
function drawControls(){
  ctx.fillStyle="rgba(27,35,64,0.8)"; ctx.beginPath(); ctx.arc(JOY.x,JOY.y,JOY.r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,0.5)"; ctx.lineWidth=3; ctx.stroke();
  ctx.strokeStyle=C.ink; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(JOY.x-34,JOY.y-7); ctx.lineTo(JOY.x-41,JOY.y); ctx.lineTo(JOY.x-34,JOY.y+7);
  ctx.moveTo(JOY.x+34,JOY.y-7); ctx.lineTo(JOY.x+41,JOY.y); ctx.lineTo(JOY.x+34,JOY.y+7); ctx.stroke();
  const jx=JOY.x+clamp(touchJoy||keyJoy,-1,1)*26, jy=JOY.y+clamp(touchJoyY||keyJoyY,-1,1)*20;
  if(cpuOn && owner===d){   // on defence: little arrows show the steal directions
    ctx.strokeStyle=C.info; ctx.lineWidth=2.5;
    for(const sx of [-1,1]){ctx.beginPath(); ctx.moveTo(JOY.x+sx*22,JOY.y+30); ctx.lineTo(JOY.x+sx*32,JOY.y+40);
      ctx.moveTo(JOY.x+sx*32,JOY.y+32); ctx.lineTo(JOY.x+sx*32,JOY.y+40); ctx.lineTo(JOY.x+sx*24,JOY.y+40); ctx.stroke();}
  }
  ctx.fillStyle=C.chalk; ctx.beginPath(); ctx.arc(jx,jy,24,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=(charge.on&&charge.fade)?C.warn:C.ink; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle=p.ground?"rgba(46,56,102,0.9)":"rgba(61,220,151,0.5)"; ctx.beginPath(); ctx.arc(JUMP.x,JUMP.y,JUMP.r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=playerDefending()?C.warn:"rgba(255,255,255,0.5)"; ctx.lineWidth=3; ctx.stroke();
  line(JUMP.x,JUMP.y+2,JUMP.x,JUMP.y-14,C.ink,3);
  ctx.beginPath(); ctx.moveTo(JUMP.x-7,JUMP.y-8); ctx.lineTo(JUMP.x,JUMP.y-15); ctx.lineTo(JUMP.x+7,JUMP.y-8); ctx.stroke();
  if(apexWindow()){ // tap now for the double jump
    ctx.fillStyle=C.green; ctx.beginPath(); ctx.arc(JUMP.x,JUMP.y,JUMP.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=C.ink; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(JUMP.x,JUMP.y,JUMP.r+5,0,Math.PI*2); ctx.stroke();
    text("AGAIN!",JUMP.x,JUMP.y+1,DISP(12),C.navy,"center");
  } else
  text(playerDefending()?"BLOCK":"JUMP",JUMP.x,JUMP.y+14,BODY(11,900),C.ink,"center");
  if(cpuOn && (owner===d || (ball.state==="flight" && ball.shooter===d))){   // defence: STEAL instead of SHOOT
    const near=Math.abs(d.x-p.x)<=STEAL_REACH && owner===d, down=shootKey||shootTouch;
    ctx.globalAlpha=stealCool>0?0.5:1;
    if(near){const pulse=4+Math.sin(performance.now()/120)*3;
      ctx.strokeStyle=C.green; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(SHOOT.x,SHOOT.y,SHOOT.r+pulse,0,Math.PI*2); ctx.stroke();}
    ctx.fillStyle="#14A3B8"; ctx.beginPath(); ctx.arc(SHOOT.x,SHOOT.y,down?39:SHOOT.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=down?C.warn:C.ink; ctx.lineWidth=3; ctx.stroke();
    text("STEAL",SHOOT.x,SHOOT.y-4,DISP(14),C.ink,"center");
    text(near?"in reach!":"get closer",SHOOT.x,SHOOT.y+14,BODY(10,900),C.ink,"center");
    ctx.globalAlpha=1;
    return;
  }
  const canShoot=owner===p && ball.state==="held" && !dunk.on;
  const dunkReady=canShoot && !charge.on && p.ground && inKey(p.x);
  const down=(shootKey||shootTouch)&&canShoot;
  ctx.globalAlpha=canShoot?1:0.4;
  if(dunkReady){
    const pulse=4+Math.sin(performance.now()/120)*3;
    ctx.strokeStyle=C.info; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(SHOOT.x,SHOOT.y,SHOOT.r+pulse,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle=C.info; ctx.beginPath(); ctx.arc(SHOOT.x,SHOOT.y,SHOOT.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=C.ink; ctx.lineWidth=3; ctx.stroke();
    text("DUNK!",SHOOT.x,SHOOT.y+1,DISP(15),C.ink,"center");
  } else {
    ctx.fillStyle=C.ball; ctx.beginPath(); ctx.arc(SHOOT.x,SHOOT.y,down?39:SHOOT.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=down?C.warn:C.seam; ctx.lineWidth=4; ctx.stroke();
    text("SHOOT",SHOOT.x,SHOOT.y+1,DISP(14),C.navy,"center");
  }
  ctx.globalAlpha=1;
}
function drawCelebration(){
  const who=celebrate.who, img=MANGA[who], col=who==="p"?C.p1:C.p2;
  const age=celebrate.T-celebrate.t, pop=Math.min(1,age*6), bounce=pop<1?pop:1+Math.sin(Math.min(age-0.17,0.3)*10)*0.04;
  ctx.save(); ctx.globalAlpha=Math.min(1,celebrate.t*2.5);
  ctx.translate(W/2,150); ctx.scale(bounce,bounce); ctx.translate(-W/2,-150);
  const x=W/2-280, y=72, w=560, h=156;
  ctx.fillStyle="rgba(16,21,43,0.92)"; rr(x,y,w,h,24); ctx.fill();
  ctx.strokeStyle=col; ctx.lineWidth=5; ctx.stroke();
  // manga portrait in a badge that breaks out of the panel
  const cx=x+86, cy=y+h/2-6, r=72;
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=col; ctx.fill(); ctx.clip();
  if(img.complete && img.naturalWidth) ctx.drawImage(img,70,8,260,260,cx-r,cy-r,r*2,r*2);
  ctx.restore();
  ctx.strokeStyle=C.ink; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  // commentary next to the face
  const tx=x+178, maxW=w-196;
  let size=34; ctx.font=DISP(size);
  while(size>18 && ctx.measureText(msg.text).width>maxW){size-=2;ctx.font=DISP(size);}
  text(msg.text,tx,y+62,DISP(size),msg.color,"left");
  if(msg.sub){
    let s2=15; ctx.font=BODY(s2,900);
    while(s2>11 && ctx.measureText(msg.sub).width>maxW){s2--;ctx.font=BODY(s2,900);}
    text(msg.sub,tx,y+104,BODY(s2,900),C.ink,"left");
  }
  ctx.restore();
}
function drawMsg(){
  if(msg.t<=0) return;
  if(celebrate.t>0 && celebrate.who){drawCelebration(); return;}
  ctx.globalAlpha=Math.min(1,msg.t*2);
  let size=34; ctx.font=DISP(size);
  while(size>18 && ctx.measureText(msg.text).width>560){size-=2;ctx.font=DISP(size);}
  const mainW=ctx.measureText(msg.text).width;
  ctx.font=BODY(15,900); const subW=msg.sub?ctx.measureText(msg.sub).width:0;
  const bw=Math.max(mainW,subW)+40;
  ctx.fillStyle="rgba(16,21,43,0.82)"; rr(W/2-bw/2,100,bw,msg.sub?80:56,16); ctx.fill();
  text(msg.text,W/2,128,DISP(size),msg.color,"center");
  if(msg.sub) text(msg.sub,W/2,160,BODY(15,900),C.ink,"center");
  ctx.globalAlpha=1;
}
function drawGame(){
  ctx.save();
  if(shakeT>0){ctx.translate((Math.random()-0.5)*7,(Math.random()-0.5)*7);}
  drawCourt(); drawNetLayer(false); drawCpu();
  for(const fx of [dblFx,cpuFx]) if(fx.t>0){ // burst rings under the feet where a double jump kicked off
    const u=1-fx.t/0.45;
    ctx.globalAlpha=1-u; ctx.strokeStyle=C.green; ctx.lineWidth=3;
    for(const k of [1,0.6]){ctx.beginPath(); ctx.ellipse(fx.x,fx.y,(10+u*34)*k,(3+u*9)*k,0,0,Math.PI*2); ctx.stroke();}
    ctx.globalAlpha=1;
  }
  drawPlayer(); drawBall(); drawNetLayer(true); drawBoardFx(); drawCountdown();
  if(dblFx.t>0){ctx.globalAlpha=Math.min(1,dblFx.t*4); text("DOUBLE JUMP!",p.x,p.y-112,DISP(14),C.green,"center"); ctx.globalAlpha=1;}
  if(stealMsg.t>0){ctx.globalAlpha=Math.min(1,stealMsg.t*3); text(stealMsg.text,p.x,p.y-112,BODY(13,900),C.warn,"center"); ctx.globalAlpha=1;}
  if(dblMiss>0){ctx.globalAlpha=Math.min(1,dblMiss*3); text("Too early or late!",p.x,p.y-112,BODY(13,900),C.warn,"center"); ctx.globalAlpha=1;}
  if(dunk.on && dunk.t<RISE+0.05){ // speed lines on the way up
    ctx.strokeStyle="rgba(255,255,255,0.5)"; ctx.lineWidth=2;
    for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(p.x-22-i*6,p.y-20-i*14);ctx.lineTo(p.x-40-i*6,p.y+4-i*14);ctx.stroke();}
  }
  if(cdunk.on && cdunk.t<RISE+0.05){
    ctx.strokeStyle="rgba(255,255,255,0.5)"; ctx.lineWidth=2;
    for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(d.x+22+i*6,d.y-20-i*14);ctx.lineTo(d.x+40+i*6,d.y+4-i*14);ctx.stroke();}
  }
  ctx.restore();
  drawMeter(); drawHUD(); drawControls(); drawMsg(); drawScreenFx();
}

function draw(){
  ctx.save();
  if(screen==="title") drawTitle();
  else if(screen==="setup") drawSetup();
  else {
    drawGame();
    if(screen==="pause") drawPause();
    else if(screen==="over") drawOver();
  }
  ctx.restore();
}

// ---------- input ----------
const roles=new Map();
function toLocal(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener("pointerdown",e=>{
  audioInit();
  const q=toLocal(e); let role=null;
  if(screen!=="play"){
    for(let i=ui.length-1;i>=0;i--){const u=ui[i];
      if(q.x>=u.x&&q.x<=u.x+u.w&&q.y>=u.y&&q.y<=u.y+u.h){play("click"); u.fn(); e.preventDefault(); return;}}
    if(screen==="title" && inMap(q)){
      mapDrag={id:e.pointerId,y0:q.y,s0:mapScroll,moved:false};
      try{cv.setPointerCapture(e.pointerId);}catch(_){}
    }
    e.preventDefault(); return;
  }
  if(q.x>=PAUSE_BTN.x-6&&q.x<=PAUSE_BTN.x+PAUSE_BTN.w+6&&q.y>=PAUSE_BTN.y-6&&q.y<=PAUSE_BTN.y+PAUSE_BTN.h+6){
    screen="pause"; touchJoy=0; shootTouch=false; roles.clear(); e.preventDefault(); return;
  }
  if(Math.hypot(q.x-SHOOT.x,q.y-SHOOT.y)<SHOOT.r+18){role="shoot";shootTouch=true;}
  else if(Math.hypot(q.x-JUMP.x,q.y-JUMP.y)<JUMP.r+12){role="jump";jumpQueued=true;}
  else if(q.x<HALF && q.y>200){role="joy";touchJoy=clamp((q.x-JOY.x)/40,-1,1);touchJoyY=clamp((q.y-JOY.y)/40,-1,1);}
  if(role){roles.set(e.pointerId,role);try{cv.setPointerCapture(e.pointerId);}catch(_){}}
  e.preventDefault();
});
cv.addEventListener("pointermove",e=>{
  if(mapDrag && mapDrag.id===e.pointerId){const q=toLocal(e); if(Math.abs(q.y-mapDrag.y0)>7) mapDrag.moved=true;
    mapScroll=clamp(mapDrag.s0-(q.y-mapDrag.y0),0,mapMaxScroll()); return;}
  if(roles.get(e.pointerId)==="joy"){const q=toLocal(e);touchJoy=clamp((q.x-JOY.x)/40,-1,1);touchJoyY=clamp((q.y-JOY.y)/40,-1,1);}
});
cv.addEventListener("wheel",e=>{
  if(screen!=="title") return;
  scrollMap(e.deltaY*0.6); e.preventDefault();
},{passive:false});
function endPointer(e){
  if(mapDrag && mapDrag.id===e.pointerId){ if(!mapDrag.moved && e.type==="pointerup") tapMap(toLocal(e)); mapDrag=null; }
  const role=roles.get(e.pointerId);
  if(role==="joy"){touchJoy=0; touchJoyY=0;}
  if(role==="shoot") shootTouch=false;
  roles.delete(e.pointerId);
}
cv.addEventListener("pointerup",endPointer); cv.addEventListener("pointercancel",endPointer);
cv.addEventListener("contextmenu",e=>e.preventDefault());
function keyJoyUpdate(){keyJoy=((keys.has("ArrowRight")||keys.has("d"))?1:0)-((keys.has("ArrowLeft")||keys.has("a"))?1:0);
  keyJoyY=(keys.has("ArrowDown")||keys.has("s"))?1:0;}
cv.addEventListener("keydown",e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," ","a","d","w","s","k"].includes(k)) e.preventDefault();
  if(e.repeat) return;
  if(screen==="title" && (k==="ArrowUp"||k==="ArrowDown")){ scrollMap(k==="ArrowUp"?-60:60); return; }
  if(k==="Escape"||k==="p"){ if(screen==="play") screen="pause"; else if(screen==="pause") screen="play"; return; }
  if(k==="Enter"){
    if(screen==="title") openNextLevel(); else if(screen==="setup") tryStart();
    else if(screen==="over") startGame(); else if(screen==="pause") screen="play";
    return;
  }
  audioInit(); keys.add(k); keyJoyUpdate();
  if(k==="ArrowUp"||k==="w") jumpQueued=true;
  if(k===" "||k==="k") shootKey=true;
});
cv.addEventListener("keyup",e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  keys.delete(k); keyJoyUpdate();
  if(k===" "||k==="k") shootKey=false;
});
cv.addEventListener("blur",()=>{keys.clear();keyJoy=0;keyJoyY=0;shootKey=false;});

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000); last=now;
  update(dt); draw(); ambientTick(); requestAnimationFrame(frame);
}
loadSave(); applyLooks(); fit(); inbound("p"); screen="title";
requestAnimationFrame(frame);
try{cv.focus({preventScroll:true});}catch(_){}
})();
</script>

  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
